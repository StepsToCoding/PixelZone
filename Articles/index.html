<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles — PixelZone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --neon-cyan:#00f5ff;
    --neon-pink:#ff2d78;
    --neon-green:#39ff14;
    --neon-purple:#bf5fff;
    --bg-dark:#080b14;
    --bg-card:#0d1220;
    --bg-card2:#111827;
    --text-main:#e8eaf6;
    --text-muted:#7a8baa;
    --border-glow:rgba(0,245,255,0.18);
  }
  body{background:var(--bg-dark);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;min-height:100vh;overflow-x:hidden}
  body.lang-ar{font-family:'Cairo','Rajdhani',sans-serif}
  .scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);z-index:999}
  .grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background-image:linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);background-size:40px 40px;z-index:0}

  nav{position:sticky;top:0;z-index:100;background:rgba(8,11,20,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-glow);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.4rem;letter-spacing:3px;color:var(--neon-cyan);text-shadow:0 0 16px var(--neon-cyan);text-decoration:none}
  .logo span{color:var(--neon-pink)}
  .nav-links{display:flex;gap:2rem;list-style:none}
  .nav-links a{text-decoration:none;color:var(--text-muted);font-size:0.9rem;letter-spacing:1px;text-transform:uppercase;font-weight:600;transition:color 0.2s}
  .nav-links a:hover,.nav-links a.active{color:var(--neon-cyan)}
  .lang-toggle{display:flex;border:1px solid var(--border-glow);border-radius:4px;overflow:hidden}
  .lang-btn{padding:6px 14px;font-size:0.8rem;font-family:'Rajdhani','Cairo',sans-serif;font-weight:600;letter-spacing:1px;background:transparent;color:var(--text-muted);border:none;cursor:pointer;transition:all 0.2s}
  .lang-btn.active{background:var(--neon-cyan);color:#080b14}

  .page-header{position:relative;z-index:1;padding:3.5rem 2rem 2.5rem;max-width:1100px;margin:0 auto}
  .page-eyebrow{font-size:0.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--neon-pink);margin-bottom:0.75rem;font-family:'Orbitron',monospace}
  .page-title{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,4vw,3rem);font-weight:900;color:var(--text-main);margin-bottom:0.75rem}
  .page-title span{color:var(--neon-cyan);text-shadow:0 0 20px rgba(0,245,255,0.4)}
  .page-sub{color:var(--text-muted);font-size:1rem;max-width:520px;line-height:1.6}
  .article-count{display:inline-block;margin-top:1rem;font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--text-muted);border:1px solid var(--border-glow);padding:5px 14px}

  .filters-bar{position:relative;z-index:1;padding:0 2rem 2rem;max-width:1100px;margin:0 auto;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
  .filter-group{display:flex;gap:0.5rem;flex-wrap:wrap}
  .filter-btn{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:1.5px;padding:7px 16px;background:transparent;border:1px solid var(--border-glow);color:var(--text-muted);cursor:pointer;transition:all 0.2s;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%)}
  .filter-btn:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
  .filter-btn.active{background:var(--neon-cyan);color:#080b14;border-color:var(--neon-cyan)}
  .filter-btn[data-cat="REVIEW"].active{background:var(--neon-pink);border-color:var(--neon-pink);color:#080b14}
  .filter-btn[data-cat="NEWS"].active{background:var(--neon-green);border-color:var(--neon-green);color:#080b14}
  .filter-btn[data-cat="WALKTHROUGH"].active{background:var(--neon-purple);border-color:var(--neon-purple);color:#080b14}
  .search-wrap{margin-left:auto;position:relative}
  .search-input{background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;font-size:0.9rem;padding:7px 14px 7px 36px;width:220px;outline:none}
  .search-input:focus{border-color:rgba(0,245,255,0.5)}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem}

  .sort-bar{position:relative;z-index:1;padding:0 2rem 1.5rem;max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:1rem}
  .sort-label{font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:1px;color:var(--text-muted)}
  .sort-select{background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;font-size:0.85rem;padding:6px 12px;cursor:pointer}
  .results-count{margin-left:auto;font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:1px;color:var(--text-muted)}

  .articles-section{position:relative;z-index:1;padding:0 2rem 3rem;max-width:1100px;margin:0 auto}
  .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}

  .article-card{background:var(--bg-card);border:1px solid var(--border-glow);padding:1.5rem;transition:all 0.2s;text-decoration:none;display:block}
  .article-card:hover{border-color:rgba(0,245,255,0.4);transform:translateY(-2px)}
  .article-badge{font-size:0.65rem;font-family:'Orbitron',monospace;letter-spacing:2px;text-transform:uppercase;display:inline-block;padding:3px 10px;border:1px solid;margin-bottom:0.75rem}
  .badge-GUIDE{color:var(--neon-cyan);border-color:var(--neon-cyan)}
  .badge-REVIEW{color:var(--neon-pink);border-color:var(--neon-pink)}
  .badge-NEWS{color:var(--neon-green);border-color:var(--neon-green)}
  .badge-WALKTHROUGH{color:var(--neon-purple);border-color:var(--neon-purple)}
  .article-title{font-family:'Orbitron',monospace;font-size:0.88rem;font-weight:700;color:var(--text-main);margin-bottom:0.75rem;line-height:1.45}
  .article-excerpt{color:var(--text-muted);font-size:0.9rem;line-height:1.55;margin-bottom:1rem}
  .article-meta-row{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:var(--text-muted);border-top:1px solid var(--border-glow);padding-top:0.75rem}
  .read-more{color:var(--neon-cyan);font-family:'Orbitron',monospace;font-size:0.65rem}

  .article-card.featured-article{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start;border-left:3px solid var(--neon-cyan);padding:2rem}
  .article-card.featured-article .article-title{font-size:1.15rem}
  .featured-label{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:3px;color:var(--neon-cyan);background:rgba(0,245,255,0.08);padding:4px 12px;display:inline-block;margin-bottom:0.75rem}
  .featured-date-big{font-family:'Orbitron',monospace;font-size:0.7rem;color:var(--text-muted)}

  .state-box{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--text-muted)}
  .state-box .icon{font-size:3rem;opacity:0.3;margin-bottom:1rem}
  .pagination{display:flex;justify-content:center;gap:0.5rem;padding:2rem 2rem 3rem}
  .page-btn{font-family:'Orbitron',monospace;font-size:0.65rem;padding:8px 14px;background:transparent;border:1px solid var(--border-glow);color:var(--text-muted);cursor:pointer}
  .page-btn.active{background:var(--neon-cyan);color:#080b14}
  .page-btn:disabled{opacity:0.3}

  footer{position:relative;z-index:1;border-top:1px solid var(--border-glow);padding:2rem;text-align:center;color:var(--text-muted)}
  footer .footer-logo{font-family:'Orbitron',monospace;font-size:1rem;color:var(--neon-cyan);margin-bottom:0.5rem}

  [dir="rtl"] .search-wrap{margin-left:0;margin-right:auto}
  [dir="rtl"] .search-icon{left:auto;right:10px}
  [dir="rtl"] .search-input{padding:7px 36px 7px 14px}
  [dir="rtl"] .article-card.featured-article{border-left:none;border-right:3px solid var(--neon-cyan)}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <a href="../index.html" class="logo">PIXEL<span>ZONE</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="../Games/index.html">Games</a></li>
    <li><a href="index.html" class="active">Articles</a></li>
    <li><a href="../Walkthroughs/index.html">Walkthroughs</a></li>
  </ul>
  <div class="lang-toggle">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ar">AR</button>
  </div>
</nav>

<div class="page-header">
  <p class="page-eyebrow" id="eyebrow">GAMING KNOWLEDGE BASE</p>
  <h1 class="page-title"><span id="titleHighlight">ALL</span> <span id="titleMain">ARTICLES</span></h1>
  <p class="page-sub" id="pageSub">Guides, reviews, news, and walkthroughs — everything you need to level up.</p>
  <div class="article-count" id="articleCount">LOADING...</div>
</div>

<div class="filters-bar">
  <div class="filter-group" id="filterGroup"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="text" id="searchInput" placeholder="Search articles...">
  </div>
</div>

<div class="sort-bar">
  <span class="sort-label" id="sortLabel">SORT:</span>
  <select class="sort-select" id="sortSelect">
    <option value="newest">Newest First</option>
    <option value="oldest">Oldest First</option>
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
  </select>
  <span class="results-count" id="resultsCount"></span>
</div>

<div class="articles-section">
  <div class="articles-grid" id="articlesGrid"></div>
</div>

<div class="pagination" id="pagination"></div>

<footer>
  <div class="footer-logo">PIXEL<span style="color:var(--neon-pink)">ZONE</span></div>
  <p id="footerText">© 2026 PixelZone — Gaming for Everyone, Everywhere</p>
</footer>

<script>
// ==============================================
// BILINGUAL ARTICLES PAGE
// ==============================================

const MANIFEST_PATHS = [
  '../pixelzone-manifest.json',
  'pixelzone-manifest.json',
  '/pixelzone-manifest.json',
];

let MANIFEST_URL = '../pixelzone-manifest.json';
let allArticles = [];
let filtered = [];
let currentFilter = 'ALL';
let currentPage = 1;
let currentLang = 'en';
const PER_PAGE = 9;

function saveLanguagePreference(lang) {
  localStorage.setItem('pixelzoneLang', lang);
}

function getSavedLanguage() {
  return localStorage.getItem('pixelzoneLang') || 'en';
}

const i18n = {
  en: {
    eyebrow: 'GAMING KNOWLEDGE BASE',
    titleHighlight: 'ALL',
    titleMain: 'ARTICLES',
    pageSub: 'Guides, reviews, news, and walkthroughs — everything you need to level up.',
    searchPlaceholder: 'Search articles...',
    sortLabel: 'SORT:',
    sortNewest: 'Newest First', sortOldest: 'Oldest First', sortAZ: 'A → Z', sortZA: 'Z → A',
    readMore: 'READ MORE →',
    featuredLabel: 'LATEST ARTICLE',
    footerText: '© 2026 PixelZone — Gaming for Everyone, Everywhere',
    noResults: 'NO ARTICLES FOUND',
    noResultsSub: 'TRY A DIFFERENT SEARCH OR FILTER',
    errorTitle: "COULDN'T LOAD ARTICLES",
    errorSub: 'Make sure pixelzone-manifest.json exists in root folder',
    articleCount: n => `${n} ARTICLE${n !== 1 ? 'S' : ''}`,
    results: (shown, total) => `SHOWING ${shown} OF ${total}`,
    prev: '← PREV', next: 'NEXT →',
    filterAll: 'ALL', filterGuide: 'GUIDE', filterReview: 'REVIEW', filterNews: 'NEWS', filterWalkthrough: 'WALKTHROUGH'
  },
  ar: {
    eyebrow: 'قاعدة معرفة الألعاب',
    titleHighlight: 'كل',
    titleMain: 'المقالات',
    pageSub: 'أدلة، مراجعات، أخبار وشروحات — كل ما تحتاجه للوصول للمستوى التالي.',
    searchPlaceholder: 'ابحث في المقالات...',
    sortLabel: 'ترتيب:',
    sortNewest: 'الأحدث أولاً', sortOldest: 'الأقدم أولاً', sortAZ: 'أ ← ي', sortZA: 'ي ← أ',
    readMore: 'اقرأ المزيد ←',
    featuredLabel: 'آخر مقالة',
    footerText: '© 2026 بيكسل زون — الألعاب للجميع',
    noResults: 'لا توجد مقالات',
    noResultsSub: 'جرّب بحثاً أو فلتراً مختلفاً',
    errorTitle: 'تعذّر تحميل المقالات',
    errorSub: 'تأكد من وجود ملف pixelzone-manifest.json',
    articleCount: n => `${n} مقالة`,
    results: (shown, total) => `عرض ${shown} من ${total}`,
    prev: '→ السابق', next: 'التالي ←',
    filterAll: 'الكل', filterGuide: 'دليل', filterReview: 'مراجعة', filterNews: 'أخبار', filterWalkthrough: 'شرح'
  }
};

function t(key, ...args) {
  const val = i18n[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-GB', {
    day: 'numeric', month: 'short', year: 'numeric'
  });
}

function buildFilterButtons() {
  const categories = ['ALL', 'GUIDE', 'REVIEW', 'NEWS', 'WALKTHROUGH'];
  const container = document.getElementById('filterGroup');
  container.innerHTML = categories.map(cat => `
    <button class="filter-btn ${cat === 'ALL' ? 'active' : ''}" data-cat="${cat}">
      ${t(`filter${cat}`) || cat}
    </button>
  `).join('');
  
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.cat;
      currentPage = 1;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPage();
    });
  });
}

function applyFiltersAndSort() {
  const q = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';
  const sort = document.getElementById('sortSelect')?.value || 'newest';

  filtered = allArticles.filter(a => {
    const matchCat = currentFilter === 'ALL' || a.category === currentFilter;
    // Search in both English and Arabic titles
    const titleEn = (a.title_en || '').toLowerCase();
    const titleAr = (a.title_ar || '').toLowerCase();
    const excerptEn = (a.excerpt_en || '').toLowerCase();
    const excerptAr = (a.excerpt_ar || '').toLowerCase();
    const matchQ = !q || titleEn.includes(q) || titleAr.includes(q) || excerptEn.includes(q) || excerptAr.includes(q);
    return matchCat && matchQ;
  });

  filtered.sort((a, b) => {
    if (sort === 'newest') return new Date(b.date) - new Date(a.date);
    if (sort === 'oldest') return new Date(a.date) - new Date(b.date);
    if (sort === 'az') return (a.title_en || '').localeCompare(b.title_en || '');
    if (sort === 'za') return (b.title_en || '').localeCompare(a.title_en || '');
    return 0;
  });
}

function renderPage() {
  applyFiltersAndSort();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > totalPages) currentPage = 1;

  const resultsSpan = document.getElementById('resultsCount');
  if (resultsSpan) {
    resultsSpan.textContent = t('results', Math.min(PER_PAGE, total - (currentPage - 1) * PER_PAGE), total);
  }

  const grid = document.getElementById('articlesGrid');
  if (!total) {
    grid.innerHTML = `<div class="state-box"><div class="icon">🔍</div><p>${t('noResults')}</p><p class="sub">${t('noResultsSub')}</p></div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);
  const searchQuery = document.getElementById('searchInput')?.value.trim() || '';

  grid.innerHTML = pageItems.map((a, idx) => {
    // ⭐ KEY CHANGE: Use bilingual title and excerpt based on current language
    const displayTitle = currentLang === 'ar' && a.title_ar ? a.title_ar : (a.title_en || 'Untitled');
    const displayExcerpt = currentLang === 'ar' && a.excerpt_ar ? a.excerpt_ar : (a.excerpt_en || '');
    
    // Determine correct article file (supports separate files for each language)
    let articleFile = a.file;
    if (a.is_bilingual) {
      if (currentLang === 'ar' && a.file_ar) {
        articleFile = a.file_ar;
      } else if (currentLang === 'en' && a.file_en) {
        articleFile = a.file_en;
      }
    }
    
    const articleUrl = `articles/${articleFile}?lang=${currentLang}`;
    const isFeatured = idx === 0 && currentPage === 1 && currentFilter === 'ALL' && !searchQuery;
    
    if (isFeatured) {
      return `
        <a href="${articleUrl}" class="article-card featured-article" data-cat="${a.category}">
          <div>
            <span class="featured-label">${t('featuredLabel')}</span><br>
            <span class="article-badge badge-${a.category}">${a.category}</span>
            <h2 class="article-title">${escapeHtml(displayTitle)}</h2>
            <p class="article-excerpt">${escapeHtml(displayExcerpt)}</p>
            <div class="article-meta-row">
              <span>${fmtDate(a.date)}</span>
              <span class="read-more">${t('readMore')}</span>
            </div>
          </div>
          <div class="featured-right">
            <div class="featured-date-big">${new Date(a.date).getFullYear()}</div>
          </div>
        </a>`;
    }
    return `
      <a href="${articleUrl}" class="article-card" data-cat="${a.category}">
        <span class="article-badge badge-${a.category}">${a.category}</span>
        <h3 class="article-title">${escapeHtml(displayTitle)}</h3>
        <p class="article-excerpt">${escapeHtml(displayExcerpt)}</p>
        <div class="article-meta-row">
          <span>${fmtDate(a.date)}</span>
          <span class="read-more">${t('readMore')}</span>
        </div>
      </a>`;
  }).join('');

  renderPagination(totalPages);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>${t('prev')}</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i - currentPage) === 2) {
      html += `<span style="color:var(--text-muted);padding:0 4px">…</span>`;
    }
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>${t('next')}</button>`;
  pg.innerHTML = html;
}

function goPage(n) {
  currentPage = n;
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onSearch() {
  currentPage = 1;
  renderPage();
}

function setLang(lang) {
  currentLang = lang;
  saveLanguagePreference(lang);
  document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  if (lang === 'ar') {
    document.body.classList.add('lang-ar');
  } else {
    document.body.classList.remove('lang-ar');
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  document.getElementById('eyebrow').textContent = t('eyebrow');
  document.getElementById('titleMain').textContent = t('titleMain');
  document.getElementById('pageSub').textContent = t('pageSub');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('sortLabel').textContent = t('sortLabel');
  document.getElementById('footerText').textContent = t('footerText');

  const opts = document.querySelectorAll('#sortSelect option');
  if (opts[0]) opts[0].textContent = t('sortNewest');
  if (opts[1]) opts[1].textContent = t('sortOldest');
  if (opts[2]) opts[2].textContent = t('sortAZ');
  if (opts[3]) opts[3].textContent = t('sortZA');

  buildFilterButtons();
  
  const hl = document.getElementById('titleHighlight');
  if (hl) hl.textContent = currentFilter === 'ALL' ? t('titleHighlight') : (t(`filter${currentFilter}`) || currentFilter);
  
  if (allArticles.length) {
    document.getElementById('articleCount').textContent = t('articleCount', allArticles.length);
    renderPage();
  }
}

function loadManifest() {
  const tryLoad = (path) => {
    return fetch(path)
      .then(res => res.ok ? res.json() : Promise.reject())
      .catch(() => Promise.reject());
  };

  let promise = Promise.reject();
  for (const path of MANIFEST_PATHS) {
    promise = promise.catch(() => tryLoad(path).then(data => {
      MANIFEST_URL = path;
      return data;
    }));
  }

  promise
    .then(data => {
      allArticles = data.articles || [];
      document.getElementById('articleCount').textContent = t('articleCount', allArticles.length);
      renderPage();
    })
    .catch(() => {
      document.getElementById('articlesGrid').innerHTML = `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <p>${t('errorTitle')}</p>
          <p class="sub">${t('errorSub')}</p>
        </div>`;
      document.getElementById('articleCount').textContent = '0 ARTICLES';
    });
}

document.getElementById('searchInput')?.addEventListener('input', onSearch);
document.getElementById('sortSelect')?.addEventListener('change', renderPage);
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

const savedLang = getSavedLanguage();
buildFilterButtons();
setLang(savedLang);
loadManifest();
</script>
