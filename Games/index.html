<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — PixelZone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --neon-purple:#bf5fff;
  --neon-amber:#ffb830;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --bg-card2:#111827;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}
body{background:var(--bg-dark);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;min-height:100vh;overflow-x:hidden}
body.lang-ar{font-family:'Cairo','Rajdhani',sans-serif}
.scanlines{position:fixed;width:100%;height:100%;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);z-index:999}
.grid-bg{position:fixed;width:100%;height:100%;pointer-events:none;background-image:linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);background-size:40px 40px;z-index:0}

nav{position:sticky;top:0;z-index:100;background:rgba(8,11,20,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-glow);padding:0 2rem;display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.4rem;color:var(--neon-cyan);letter-spacing:3px;text-shadow:0 0 16px var(--neon-cyan);text-decoration:none}
.logo span{color:var(--neon-pink)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--text-muted);font-size:0.9rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;transition:color 0.2s}
.nav-links a:hover,.nav-links a.active{color:var(--neon-cyan)}
.lang-toggle{display:flex;border:1px solid var(--border-glow);border-radius:4px;overflow:hidden}
.lang-btn{padding:6px 14px;font-size:0.8rem;font-family:'Rajdhani','Cairo',sans-serif;font-weight:600;letter-spacing:1px;background:transparent;color:var(--text-muted);border:none;cursor:pointer;transition:all 0.2s}
.lang-btn.active{background:var(--neon-cyan);color:#080b14}

.page-header{position:relative;z-index:1;padding:3.5rem 2rem 1.5rem;max-width:1100px;margin:0 auto}
.page-eyebrow{font-size:0.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--neon-pink);margin-bottom:0.75rem;font-family:'Orbitron',monospace}
.page-title{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,4vw,3rem);font-weight:900;color:var(--text-main)}
.page-title span{color:var(--neon-cyan);text-shadow:0 0 20px rgba(0,245,255,0.4)}
.game-count{display:inline-block;margin-top:1rem;font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--text-muted);border:1px solid var(--border-glow);padding:5px 14px}

.controls{position:relative;z-index:1;padding:0 2rem 1rem;max-width:1100px;margin:0 auto;display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:1rem;pointer-events:none}
.search-input{width:100%;background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;font-size:0.95rem;padding:8px 14px 8px 34px;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:rgba(0,245,255,0.5)}
.search-input::placeholder{color:var(--text-muted)}

.filter-group{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}
.filter-label{font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;color:var(--text-muted);white-space:nowrap}
.filter-btn{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:1.5px;padding:7px 14px;background:transparent;border:1px solid var(--border-glow);color:var(--text-muted);cursor:pointer;transition:all 0.2s;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);white-space:nowrap}
.filter-btn:hover{border-color:var(--neon-cyan);color:var(--neon-cyan)}
.filter-btn.active{background:var(--neon-cyan);color:#080b14;border-color:var(--neon-cyan)}

.filter-btn[data-genre="ACTION"].active{background:var(--neon-pink);border-color:var(--neon-pink);color:#080b14}
.filter-btn[data-genre="PUZZLE"].active{background:var(--neon-purple);border-color:var(--neon-purple);color:#080b14}
.filter-btn[data-genre="STRATEGY"].active{background:var(--neon-amber);border-color:var(--neon-amber);color:#080b14}
.filter-btn[data-genre="ADVENTURE"].active{background:var(--neon-green);border-color:var(--neon-green);color:#080b14}
.filter-btn[data-genre="SPORTS"].active{background:#00cfff;border-color:#00cfff;color:#080b14}
.filter-btn[data-genre="RACING"].active{background:#ff6a00;border-color:#ff6a00;color:#080b14}
.filter-btn[data-genre="RPG"].active{background:#c084fc;border-color:#c084fc;color:#080b14}
.filter-btn[data-genre="SHOOTER"].active{background:#f87171;border-color:#f87171;color:#080b14}
.filter-btn[data-genre="PLATFORMER"].active{background:#34d399;border-color:#34d399;color:#080b14}
.filter-btn[data-genre="FIGHTING"].active{background:#fb923c;border-color:#fb923c;color:#080b14}

.sort-row{position:relative;z-index:1;padding:0 2rem 1.5rem;max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.sort-label{font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:1.5px;color:var(--text-muted)}
.sort-select{background:var(--bg-card);border:1px solid var(--border-glow);color:var(--text-main);font-family:'Rajdhani','Cairo',sans-serif;font-size:0.9rem;padding:6px 12px;outline:none;cursor:pointer}
.sort-select option{background:var(--bg-dark)}
.results-info{margin-left:auto;font-family:'Orbitron',monospace;font-size:0.62rem;letter-spacing:1px;color:var(--text-muted)}

.games-section{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 2rem 3rem}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.25rem}

.game-card{background:var(--bg-card);border:1px solid var(--border-glow);padding:1.4rem 1.2rem 1.2rem;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;text-decoration:none;display:block}
.game-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:transparent;transition:background 0.2s}
.game-card:hover{border-color:var(--neon-green);transform:translateY(-4px);background:var(--bg-card2)}
.game-card:hover::before{background:var(--neon-green)}

.game-icon{font-size:2.4rem;line-height:1;margin-bottom:0.6rem;display:block}
.game-name{font-family:'Orbitron',monospace;font-size:0.72rem;font-weight:700;color:var(--text-main);line-height:1.4;margin-bottom:0.6rem;word-break:break-word}
.game-genres{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:0.5rem}
.genre-tag{font-size:0.55rem;font-family:'Orbitron',monospace;letter-spacing:1px;padding:2px 7px;border:1px solid;border-radius:1px}

.gt-ACTION{color:var(--neon-pink);border-color:rgba(255,45,120,0.4)}
.gt-PUZZLE{color:var(--neon-purple);border-color:rgba(191,95,255,0.4)}
.gt-STRATEGY{color:var(--neon-amber);border-color:rgba(255,184,48,0.4)}
.gt-ADVENTURE{color:var(--neon-green);border-color:rgba(57,255,20,0.4)}
.gt-SPORTS{color:#00cfff;border-color:rgba(0,207,255,0.4)}
.gt-RACING{color:#ff6a00;border-color:rgba(255,106,0,0.4)}
.gt-RPG{color:#c084fc;border-color:rgba(192,132,252,0.4)}
.gt-SHOOTER{color:#f87171;border-color:rgba(248,113,113,0.4)}
.gt-PLATFORMER{color:#34d399;border-color:rgba(52,211,153,0.4)}
.gt-FIGHTING{color:#fb923c;border-color:rgba(251,146,60,0.4)}
.gt-OTHER{color:var(--text-muted);border-color:var(--border-glow)}

.play-overlay{position:absolute;inset:0;background:rgba(0,245,255,0.05);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;font-family:'Orbitron',monospace;font-size:0.65rem;letter-spacing:2px;color:var(--neon-cyan)}
.game-card:hover .play-overlay{opacity:1}

.skeleton{background:linear-gradient(90deg,var(--bg-card) 25%,#161e30 50%,var(--bg-card) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:2px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--bg-card);border:1px solid var(--border-glow);padding:1.4rem;text-align:center}

.state-box{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--text-muted)}
.state-box .icon{font-size:3rem;opacity:0.3;margin-bottom:1rem}
.state-box p{font-family:'Orbitron',monospace;font-size:0.72rem;letter-spacing:2px;margin-bottom:0.5rem}
.state-box .sub{font-size:0.62rem;opacity:0.6;letter-spacing:1px}

.glow-line{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent);opacity:0.4;position:relative;z-index:1}
footer{position:relative;z-index:1;border-top:1px solid var(--border-glow);padding:2rem;text-align:center;color:var(--text-muted);font-size:0.85rem;letter-spacing:1px}
footer .footer-logo{font-family:'Orbitron',monospace;font-size:1rem;color:var(--neon-cyan);margin-bottom:0.5rem}

[dir="rtl"] .search-wrap{order:-1}
[dir="rtl"] .search-icon{left:auto;right:10px}
[dir="rtl"] .search-input{padding:8px 34px 8px 14px}
[dir="rtl"] .results-info{margin-left:0;margin-right:auto}

@media(max-width:600px){
  .controls{flex-direction:column;align-items:stretch}
  .search-wrap{max-width:100%}
  .sort-row{flex-wrap:wrap}
  .results-info{margin-left:0}
}

  /* MOBILE RESPONSIVE STYLES */
  @media (max-width: 768px) {
    nav {
      padding: 0 1rem;
    }
    
    .nav-links {
      position: fixed;
      top: 64px;
      left: -100%;
      width: 75%;
      max-width: 280px;
      height: calc(100vh - 64px);
      background: rgba(8, 11, 20, 0.98);
      backdrop-filter: blur(16px);
      flex-direction: column;
      padding: 2rem 1rem;
      gap: 1.5rem;
      transition: left 0.3s ease;
      z-index: 1000;
      border-right: 1px solid var(--border-glow);
    }
    
    .nav-links.open {
      left: 0;
    }
    
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 1001;
    }
    
    .hamburger span {
      width: 25px;
      height: 2px;
      background: var(--neon-cyan);
      transition: all 0.3s ease;
    }
    
    .hamburger.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    
    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger.open span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }
    
    .menu-overlay {
      position: fixed;
      top: 64px;
      left: 0;
      width: 100%;
      height: calc(100vh - 64px);
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      display: none;
    }
    
    .menu-overlay.open {
      display: block;
    }
    
    .articles-grid, .wt-grid, .games-grid {
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    
    .hero {
      padding: 2rem 1rem;
    }
    
    .hero-btns {
      flex-direction: column;
      align-items: center;
    }
    
    .btn-primary, .btn-secondary, .btn-discord {
      width: 100%;
      max-width: 220px;
      justify-content: center;
    }
    
    .controls {
      flex-direction: column;
    }
    
    .search-wrap {
      max-width: 100%;
    }
    
    .search-input {
      font-size: 16px;
    }
    
    .filter-group {
      justify-content: center;
    }
    
    .sort-row {
      flex-direction: column;
      align-items: stretch;
    }
    
    .results-info {
      margin-left: 0;
      text-align: center;
    }
    
    .post-hero {
      padding: 2rem 1rem;
    }
    
    .post-body {
      padding: 0 1rem 3rem;
    }
    
    .review-score-box {
      flex-direction: column;
      text-align: center;
    }
    
    .pro-con-box {
      grid-template-columns: 1fr;
    }
    
    .share-buttons {
      gap: 0.5rem;
    }
    
    .share-btn {
      font-size: 0.6rem;
      padding: 6px 12px;
    }
  }
  
  [dir="rtl"] .nav-links {
    left: auto;
    right: -100%;
    border-right: none;
    border-left: 1px solid var(--border-glow);
  }
  
  [dir="rtl"] .nav-links.open {
    left: auto;
    right: 0;
  }
  
  [dir="rtl"] .results-info {
    margin-right: 0;
  }
</style>

<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <a href="../index.html" class="logo">PIXEL<span>ZONE</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="index.html" class="active">Games</a></li>
    <li><a href="../Articles/index.html">Articles</a></li>
    <li><a href="../Walkthroughs/index.html">Walkthroughs</a></li>
  </ul>
  
  <!-- Hamburger Menu Button -->
  <button class="hamburger" id="hamburger" aria-label="Menu">

    <span></span>
    <span></span>

  <!-- Menu Overlay -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="lang-toggle">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ar">AR</button>
  </div>
</nav>

<div class="page-header">
  <p class="page-eyebrow" id="eyebrow">FLASH GAME ARCADE</p>
  <h1 class="page-title"><span id="titleAll">ALL</span> <span id="titleSpan">GAMES</span></h1>
  <div class="game-count" id="gameCount">LOADING...</div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="text" id="searchInput" placeholder="Search games...">
  </div>
  <div class="filter-group">
    <span class="filter-label" id="filterLabel">GENRE:</span>
    <button class="filter-btn active" data-genre="ALL" id="filterAllBtn">ALL</button>
    <button class="filter-btn" data-genre="ACTION" id="filterActionBtn">ACTION</button>
    <button class="filter-btn" data-genre="ADVENTURE" id="filterAdventureBtn">ADVENTURE</button>
    <button class="filter-btn" data-genre="PUZZLE" id="filterPuzzleBtn">PUZZLE</button>
    <button class="filter-btn" data-genre="STRATEGY" id="filterStrategyBtn">STRATEGY</button>
    <button class="filter-btn" data-genre="PLATFORMER" id="filterPlatformerBtn">PLATFORMER</button>
    <button class="filter-btn" data-genre="FIGHTING" id="filterFightingBtn">FIGHTING</button>
    <button class="filter-btn" data-genre="SHOOTER" id="filterShooterBtn">SHOOTER</button>
    <button class="filter-btn" data-genre="RACING" id="filterRacingBtn">RACING</button>
    <button class="filter-btn" data-genre="SPORTS" id="filterSportsBtn">SPORTS</button>
    <button class="filter-btn" data-genre="RPG" id="filterRpgBtn">RPG</button>
  </div>
</div>

<div class="sort-row">
  <span class="sort-label" id="sortLabel">SORT:</span>
  <select class="sort-select" id="sortSelect">
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
  </select>
  <span class="results-info" id="resultsInfo"></span>
</div>

<div class="games-section">
  <div class="games-grid" id="gamesGrid">
    <div class="skel-card"><div class="skeleton" style="width:48px;height:48px;margin:0 auto 12px;border-radius:4px"></div><div class="skeleton" style="height:10px;width:80%;margin:0 auto 8px"></div><div class="skeleton" style="height:8px;width:50%;margin:0 auto"></div></div>
    <div class="skel-card"><div class="skeleton" style="width:48px;height:48px;margin:0 auto 12px;border-radius:4px"></div><div class="skeleton" style="height:10px;width:80%;margin:0 auto 8px"></div><div class="skeleton" style="height:8px;width:50%;margin:0 auto"></div></div>
  </div>
</div>

<div class="glow-line"></div>
<footer>
  <div class="footer-logo">PIXEL<span style="color:var(--neon-pink)">ZONE</span></div>
  <p id="footerText">© 2026 PixelZone — Gaming for Everyone, Everywhere</p>
</footer>

<script>
let allGames = [];
let currentGenre = "ALL";
let currentLang = "en";

// Data that will be loaded from external JSON
let genreMap = {};
let iconMap = {};
let armorExclusive = [];

// Get saved language from localStorage
function getSavedLanguage() {
  return localStorage.getItem('pixelzoneLang') || 'en';
}

// Save language preference
function saveLanguagePreference(lang) {
  localStorage.setItem('pixelzoneLang', lang);
}

// Translations
const i18n = {
  en: {
    eyebrow: "FLASH GAME ARCADE", titleAll: "ALL", titleSpan: "GAMES", searchPlaceholder: "Search games...",
    filterLabel: "GENRE:", sortLabel: "SORT:", sortAZ: "A → Z", sortZA: "Z → A",
    playNow: "▶ PLAY NOW", noResults: "NO GAMES FOUND", noResultsSub: "TRY A DIFFERENT SEARCH OR GENRE",
    error: "COULDN'T LOAD GAMES", errorSub: "MAKE SURE GAMES ARE IN /Games/games/ FOLDER",
    dataError: "COULDN'T LOAD GAME DATA", dataErrorSub: "CHECK games-data.json FILE",
    results: (s, t) => `SHOWING ${s} OF ${t}`, count: (n) => `${n} GAME${n !== 1 ? "S" : ""}`,
    footerText: "© 2026 PixelZone — Gaming for Everyone, Everywhere",
    genres: {
      ALL: "ALL", ACTION: "ACTION", ADVENTURE: "ADVENTURE", PUZZLE: "PUZZLE",
      STRATEGY: "STRATEGY", PLATFORMER: "PLATFORMER", FIGHTING: "FIGHTING",
      SHOOTER: "SHOOTER", RACING: "RACING", SPORTS: "SPORTS", RPG: "RPG"
    }
  },
  ar: {
    eyebrow: "أركيد الألعاب", titleAll: "كل", titleSpan: "الألعاب", searchPlaceholder: "ابحث عن لعبة...",
    filterLabel: "النوع:", sortLabel: "ترتيب:", sortAZ: "أ → ي", sortZA: "ي ← أ",
    playNow: "▶ العب الآن", noResults: "لا توجد ألعاب", noResultsSub: "جرّب بحثاً أو فلتراً مختلفاً",
    error: "تعذّر تحميل الألعاب", errorSub: "تأكد من وجود الألعاب في مجلد /Games/games/",
    dataError: "تعذّر تحميل بيانات الألعاب", dataErrorSub: "تحقق من ملف games-data.json",
    results: (s, t) => `عرض ${s} من ${t}`, count: (n) => `${n} لعبة`,
    footerText: "© 2026 بيكسل زون — الألعاب للجميع",
    genres: {
      ALL: "الكل", ACTION: "أكشن", ADVENTURE: "مغامرة", PUZZLE: "ألغاز",
      STRATEGY: "استراتيجية", PLATFORMER: "منصات", FIGHTING: "قتال",
      SHOOTER: "تصويب", RACING: "سباق", SPORTS: "رياضة", RPG: "آر بي جي"
    }
  }
};

function T(key, ...args) {
  const val = i18n[currentLang][key];
  return typeof val === "function" ? val(...args) : val;
}

function isArmorExclusive(gameName) {
  const displayName = gameName.replace(/_/g, " ");
  return armorExclusive.some(exclusive => 
    displayName.toLowerCase().includes(exclusive.toLowerCase()) ||
    gameName.toLowerCase().includes(exclusive.toLowerCase())
  );
}

function getGenres(key) {
  return genreMap[key] || genreMap[key.replace(/_/g, " ")] || ["OTHER"];
}

function getIcon(key) {
  return iconMap[key] || iconMap[key.replace(/_/g, " ")] || "🎮";
}

function applyFilters() {
  const searchInput = document.getElementById("searchInput");
  const q = searchInput ? searchInput.value.toLowerCase().trim() : "";
  const sort = document.getElementById("sortSelect").value;

  let filtered = allGames.filter(g => {
    const matchGenre = currentGenre === "ALL" || getGenres(g.key).includes(currentGenre);
    const matchSearch = !q || g.display.toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });

  if (sort === "az") {
    filtered.sort((a, b) => a.display.localeCompare(b.display));
  } else if (sort === "za") {
    filtered.sort((a, b) => b.display.localeCompare(a.display));
  }

  const resultsSpan = document.getElementById("resultsInfo");
  if (resultsSpan) {
    resultsSpan.textContent = T("results", filtered.length, allGames.length);
  }

  const grid = document.getElementById("gamesGrid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="state-box"><div class="icon">🕹️</div><p>${T("noResults")}</p><p class="sub">${T("noResultsSub")}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(g => {
    const genres = getGenres(g.key);
    const tagsHTML = genres.map(gen => 
      `<span class="genre-tag gt-${gen}">${T("genres")[gen] || gen}</span>`
    ).join("");
    return `
      <a class="game-card" href="play.html?game=${encodeURIComponent(g.filename)}&lang=${currentLang}">
        <div class="play-overlay">${T("playNow")}</div>
        <span class="game-icon">${getIcon(g.key)}</span>
        <div class="game-name">${g.display}</div>
        <div class="game-genres">${tagsHTML}</div>
      </a>
    `;
  }).join("");
}

function setGenre(genre) {
  currentGenre = genre;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.genre === genre);
  });
  applyFilters();
}

function setLang(lang) {
  currentLang = lang;
  saveLanguagePreference(lang);
  document.body.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  if (lang === "ar") {
    document.body.classList.add("lang-ar");
  } else {
    document.body.classList.remove("lang-ar");
  }
  
  // Update all UI text
  document.getElementById("eyebrow").textContent = T("eyebrow");
  document.getElementById("titleAll").textContent = T("titleAll");
  document.getElementById("titleSpan").textContent = T("titleSpan");
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.placeholder = T("searchPlaceholder");
  document.getElementById("filterLabel").textContent = T("filterLabel");
  document.getElementById("sortLabel").textContent = T("sortLabel");
  document.getElementById("footerText").textContent = T("footerText");

  const sortSelect = document.getElementById("sortSelect");
  if (sortSelect && sortSelect.options.length >= 2) {
    sortSelect.options[0].textContent = T("sortAZ");
    sortSelect.options[1].textContent = T("sortZA");
  }

  // Update filter buttons with translated text
  document.querySelectorAll(".filter-btn").forEach(btn => {
    const genre = btn.dataset.genre;
    if (genre && T("genres")[genre]) {
      btn.textContent = T("genres")[genre];
    }
  });

  // Update active button styling
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });

  if (allGames.length) {
    document.getElementById("gameCount").textContent = T("count", allGames.length);
    applyFilters();
  }
}

function loadGameData() {
  fetch('games-data.json')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      genreMap = data.genres || {};
      iconMap = data.icons || {};
      armorExclusive = data.armorExclusive || [];
      
      console.log(`✅ Loaded game data: ${Object.keys(genreMap).length} genres, ${Object.keys(iconMap).length} icons, ${armorExclusive.length} exclusives`);
      
      return loadGameFiles();
    })
    .catch(err => {
      console.error("Error loading games-data.json:", err);
      const grid = document.getElementById("gamesGrid");
      if (grid) {
        grid.innerHTML = `<div class="state-box"><div class="icon">📁</div><p>${T("dataError")}</p><p class="sub">${T("dataErrorSub")}</p></div>`;
      }
    });
}

function loadGameFiles() {
  const USERNAME = "StepsToCoding";
  const REPO = "PixelZone";
  
  return fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/Games/games`)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(files => {
      allGames = files
        .filter(f => f.name.endsWith(".swf"))
        .map(f => {
          const key = f.name.replace(".swf", "");
          const display = key.replace(/_/g, " ");
          return { filename: f.name, key, display };
        })
        .filter(g => !isArmorExclusive(g.display) && !isArmorExclusive(g.key));

      const countSpan = document.getElementById("gameCount");
      if (countSpan) countSpan.textContent = T("count", allGames.length);
      
      applyFilters();
    })
    .catch(err => {
      console.error("Error loading game files:", err);
      const grid = document.getElementById("gamesGrid");
      if (grid) {
        grid.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><p>${T("error")}</p><p class="sub">${T("errorSub")}</p></div>`;
      }
      const countSpan = document.getElementById("gameCount");
      if (countSpan) countSpan.textContent = "0 GAMES";
    });
}

// Event listeners
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => setGenre(btn.dataset.genre));
});

document.getElementById("searchInput")?.addEventListener("input", applyFilters);
document.getElementById("sortSelect")?.addEventListener("change", applyFilters);
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

// Initialize with saved language preference
const savedLang = getSavedLanguage();
setLang(savedLang);
loadGameData();
</script>

<script>
// Mobile Hamburger Menu
function initMobileMenu() {
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.querySelector('.nav-links');
  const overlay = document.getElementById('menuOverlay');
  
  if (!hamburger || !navLinks) return;
  
  function toggleMenu() {
    navLinks.classList.toggle('open');
    hamburger.classList.toggle('open');
    if (overlay) overlay.classList.toggle('open');
    document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
  }
  
  hamburger.addEventListener('click', toggleMenu);
  if (overlay) {
    overlay.addEventListener('click', toggleMenu);
  }
  
  // Close menu when clicking a link
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      hamburger.classList.remove('open');
      if (overlay) overlay.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initMobileMenu);
} else {
  initMobileMenu();
}
</script>
