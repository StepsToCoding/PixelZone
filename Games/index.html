<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ROOT */
:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --bg-card2:#111827;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}

/* BACKGROUND EFFECTS */
.scanlines{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  z-index:999;
}

.grid-bg{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:0;
}

body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
}

/* NAV */
nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);
  padding:0 2rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:64px;
}

.logo{
  font-family:'Orbitron';
  font-weight:900;
  font-size:1.4rem;
  color:var(--neon-cyan);
  letter-spacing:3px;
  text-shadow:0 0 16px var(--neon-cyan);
}
.logo span{color:var(--neon-pink)}

.nav-links{
  display:flex;
  gap:2rem;
  list-style:none;
}
.nav-links a{
  text-decoration:none;
  color:var(--text-muted);
  font-size:0.9rem;
  text-transform:uppercase;
  letter-spacing:1px;
}
.nav-links a:hover{color:var(--neon-cyan)}

/* LANG */
.lang-toggle{
  display:flex;
  border:1px solid var(--border-glow);
}
.lang-btn{
  padding:6px 12px;
  background:none;
  border:none;
  color:var(--text-muted);
  cursor:pointer;
}
.lang-btn.active{
  background:var(--neon-cyan);
  color:#000;
}

/* HERO */
.hero{
  position:relative;
  z-index:1;
  text-align:center;
  padding:5rem 2rem 2rem;
}

.hero-title{
  font-family:'Orbitron';
  font-size:clamp(2rem,5vw,3.5rem);
}
.hero-title span{
  color:var(--neon-cyan);
  text-shadow:0 0 20px rgba(0,245,255,0.5);
}

/* GLOW LINE */
.glow-line{
  width:100%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent);
  margin:2rem auto;
  opacity:0.4;
}

/* GRID */
.games-grid{
  position:relative;
  z-index:1;
  max-width:1100px;
  margin:0 auto;
  padding:2rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1.5rem;
}

.game-card{
  background:var(--bg-card);
  border:1px solid var(--border-glow);
  padding:1.5rem;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
}
.game-card:hover{
  border-color:var(--neon-green);
  transform:translateY(-4px);
  background:var(--bg-card2);
}

.game-name{
  font-family:'Orbitron';
  font-size:0.75rem;
  margin-top:0.5rem;
}

/* RTL */
[dir="rtl"]{
  direction:rtl;
}
</style>

</head>

<body>

<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <div class="logo">PIXEL<span>ZONE</span></div>

  <ul class="nav-links">
    <li><a id="navHome" href="../index.html">Home</a></li>
    <li><a id="navArticles" href="#">Articles</a></li>
    <li><a id="navWT" href="#">Walkthroughs</a></li>
  </ul>

  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('ar')">AR</button>
  </div>
</nav>

<div class="hero">
  <h1 class="hero-title" id="title">ALL <span>GAMES</span></h1>
</div>

<div class="glow-line"></div>

<div class="games-grid" id="gamesGrid"></div>

<script>
const translations = {
  en:{navHome:"Home",navArticles:"Articles",navWT:"Walkthroughs",title:"ALL GAMES"},
  ar:{navHome:"الرئيسية",navArticles:"المقالات",navWT:"الشروحات",title:"كل الألعاب"}
};

function setLang(lang){
  document.body.setAttribute("dir", lang==="ar"?"rtl":"ltr");
  document.getElementById("navHome").textContent=translations[lang].navHome;
  document.getElementById("navArticles").textContent=translations[lang].navArticles;
  document.getElementById("navWT").textContent=translations[lang].navWT;
  document.getElementById("title").innerHTML=translations[lang].title;
}

const USERNAME="StepsToCoding";
const REPO="PixelZone";

fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/Games/games`)
.then(r=>r.json())
.then(files=>{
  const grid=document.getElementById("gamesGrid");
  files.forEach(f=>{
    if(f.name.endsWith(".swf")){
      const c=document.createElement("div");
      c.className="game-card";
      c.innerHTML=`<div style="font-size:2rem;">🎮</div><div class="game-name">${f.name.replace(".swf","")}</div>`;
      c.onclick=()=>window.location.href="play.html?game="+f.name;
      grid.appendChild(c);
    }
  });
});
</script>

</body>
</html>
