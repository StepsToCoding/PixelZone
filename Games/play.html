<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIXELZONE · GAME CORE · PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --bg-card2:#111827;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}

.scanlines{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  z-index:999;
}

.grid-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  z-index:0;
}

body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);
  padding:0 1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:60px;
  flex-wrap:wrap;
}

.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;
  font-size:1.2rem;
  letter-spacing:2px;
  color:var(--neon-cyan);
  text-shadow:0 0 16px var(--neon-cyan);
}
.logo span{color:var(--neon-pink)}

.nav-links{
  display:flex;
  gap:1rem;
  list-style:none;
}

.nav-links a{
  text-decoration:none;
  color:var(--text-muted);
  font-size:0.75rem;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:600;
  transition:color 0.2s;
}
.nav-links a:hover{
  color:var(--neon-cyan);
}

.controls{
  display:flex;
  gap:0.5rem;
}

.btn{
  padding:6px 14px;
  background:transparent;
  color:var(--neon-pink);
  font-family:'Orbitron',monospace;
  font-size:0.65rem;
  font-weight:700;
  letter-spacing:1px;
  border:1px solid var(--neon-pink);
  cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all 0.2s;
}
.btn:hover{
  background:var(--neon-pink);
  color:#080b14;
}

.title{
  position:relative;
  z-index:1;
  text-align:center;
  padding:1rem;
  font-family:'Orbitron';
  font-size:1rem;
}

.game-container{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  padding:0.5rem;
}

#game{
  width:100%;
  max-width:1000px;
  height:auto;
  aspect-ratio:16/9;
  border:1px solid var(--border-glow);
  background:black;
  position:relative;
}

.loading{
  position:relative;
  z-index:1;
  text-align:center;
  color:var(--text-muted);
  margin-top:0.5rem;
  font-size:0.8rem;
}

/* SAVE/LOAD PANEL */
.save-panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
  margin: 1rem auto;
  padding: 0.8rem;
  max-width: 1000px;
  background: rgba(13, 18, 32, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-glow);
  border-radius: 4px;
}

.save-btn {
  background: rgba(0, 245, 255, 0.1);
  color: var(--neon-cyan);
  border: 1px solid var(--neon-cyan);
  padding: 6px 16px;
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}

.save-btn:hover {
  background: var(--neon-cyan);
  color: #080b14;
}

.file-input-label {
  background: rgba(255, 45, 120, 0.1);
  color: var(--neon-pink);
  border: 1px solid var(--neon-pink);
  padding: 6px 16px;
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  display: inline-block;
  transition: all 0.2s;
}

.file-input-label:hover {
  background: var(--neon-pink);
  color: #080b14;
}

input[type="file"] {
  display: none;
}

.status-msg {
  color: var(--neon-green);
  font-size: 0.75rem;
  margin-left: 0.5rem;
  font-family: 'Rajdhani', monospace;
  word-break: break-word;
}

/* ===== MOBILE VIRTUAL GAMEPAD ===== */
.gamepad-overlay {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  background: rgba(8, 11, 20, 0.85);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--neon-cyan);
  padding: 12px 10px;
  display: none;
  flex-direction: column;
  gap: 12px;
  transition: transform 0.2s;
}

.gamepad-row {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.gamepad-btn {
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  font-family: 'Orbitron', monospace;
  font-weight: bold;
  font-size: 1.3rem;
  width: 70px;
  padding: 12px 0;
  text-align: center;
  border-radius: 12px;
  backdrop-filter: blur(4px);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: all 0.05s linear;
  box-shadow: 0 0 8px rgba(0,245,255,0.3);
}

.gamepad-btn:active {
  background: var(--neon-cyan);
  color: #080b14;
  transform: scale(0.96);
  box-shadow: 0 0 16px var(--neon-cyan);
}

.gamepad-space {
  width: 120px;
  background: rgba(255,45,120,0.2);
  border-color: var(--neon-pink);
  color: var(--neon-pink);
  font-size: 0.9rem;
  letter-spacing: 2px;
}

.gamepad-enter {
  width: 90px;
  background: rgba(57,255,20,0.15);
  border-color: var(--neon-green);
  color: var(--neon-green);
}

/* Hide on desktop */
@media (min-width: 768px) {
  .gamepad-overlay {
    display: none !important;
  }
}

/* Mobile adjustments */
@media (max-width: 767px) {
  .save-panel {
    margin-bottom: 70px;
  }
  .gamepad-btn {
    width: 65px;
    font-size: 1.1rem;
    padding: 10px 0;
  }
  .gamepad-space {
    width: 100px;
  }
}

[dir="rtl"]{direction:rtl}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <div class="logo">PIXEL<span>ZONE</span></div>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="index.html">Games</a></li>
    <li><a href="../Articles/index.html">Articles</a></li>
    <li><a href="../Walkthroughs/index.html">Walkthroughs</a></li>
  </ul>
  <div class="controls">
    <button class="btn" onclick="goBack()">BACK</button>
    <button class="btn" onclick="fullscreenGame()">FULLSCREEN</button>
  </div>
</nav>

<div class="title" id="gameTitle">Loading...</div>

<div class="game-container">
  <div id="game"></div>
</div>

<!-- SAVE/LOAD PANEL -->
<div class="save-panel" id="savePanel" style="display: none;">
  <button class="save-btn" id="saveGameBtn" onclick="downloadSaveFile()">💾 DOWNLOAD SAVE</button>
  <label class="file-input-label" for="loadSaveInput">📂 LOAD SAVE FILE</label>
  <input type="file" id="loadSaveInput" accept=".pzsave" onchange="uploadSaveFile(this)">
  <span id="saveStatus" class="status-msg"></span>
</div>

<!-- MOBILE VIRTUAL GAMEPAD -->
<div id="gamepadOverlay" class="gamepad-overlay">
  <div class="gamepad-row">
    <div class="gamepad-btn" data-key="ArrowUp">▲ UP</div>
    <div class="gamepad-btn" data-key="ArrowDown">▼ DOWN</div>
    <div class="gamepad-btn" data-key="ArrowLeft">◀ LEFT</div>
    <div class="gamepad-btn" data-key="ArrowRight">▶ RIGHT</div>
  </div>
  <div class="gamepad-row">
    <div class="gamepad-btn gamepad-space" data-key=" ">␣ SPACE</div>
    <div class="gamepad-btn gamepad-enter" data-key="Enter">↵ ENTER</div>
    <div class="gamepad-btn" data-key="Shift">⇧ SHIFT</div>
    <div class="gamepad-btn" data-key="Control">⌃ CTRL</div>
  </div>
  <div class="gamepad-row">
    <div class="gamepad-btn" data-key="KeyW">W</div>
    <div class="gamepad-btn" data-key="KeyA">A</div>
    <div class="gamepad-btn" data-key="KeyS">S</div>
    <div class="gamepad-btn" data-key="KeyD">D</div>
    <div class="gamepad-btn" data-key="KeyE">E</div>
    <div class="gamepad-btn" data-key="KeyR">R</div>
  </div>
</div>

<div class="loading" id="loadingText">🔧 Initializing Ruffle & connecting game engine...</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<script>
  // Global variables
  let currentGameFile = null;
  let currentPlayer = null;
  let currentGameName = null;
  let ruffleInstance = null;

  // NAV BUTTONS
  window.goBack = function() {
    window.location.href = "index.html";
  };

  window.fullscreenGame = function() {
    const container = document.getElementById("game");
    if (container && container.requestFullscreen) {
      container.requestFullscreen().catch(err => {
        document.getElementById("loadingText").innerHTML = "⚠️ Fullscreen not allowed";
      });
    }
  };

  // ---------- SAVE/LOAD SYSTEM (unchanged, fully functional) ----------
  async function downloadSaveFile() {
    if (!currentGameName || !currentPlayer) {
      showSaveStatus("⚠️ Game not loaded yet!", "#ff2d78");
      return;
    }

    try {
      let gameSpecificStorage = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.includes(currentGameName) || key.includes(currentGameFile.replace('.swf', '')))) {
          gameSpecificStorage[key] = localStorage.getItem(key);
        }
      }
      
      const cookies = document.cookie;
      
      const saveFile = {
        gameName: currentGameName,
        gameFile: currentGameFile,
        timestamp: Date.now(),
        version: "1.0",
        localStorageData: gameSpecificStorage,
        cookies: cookies,
        note: "Save file for " + currentGameName + " - Only works with this specific game"
      };
      
      const jsonStr = JSON.stringify(saveFile);
      const encoded = btoa(encodeURIComponent(jsonStr));
      
      const blob = new Blob([encoded], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${currentGameName}_save_${new Date().toISOString().slice(0,19)}.pzsave`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showSaveStatus("✅ Save file downloaded!", "#39ff14");
      
      if (Object.keys(gameSpecificStorage).length === 0 && !cookies) {
        setTimeout(() => {
          showSaveStatus("💡 Tip: Some Flash games save internally. Use 'Export Game State' if this save doesn't work", "#ffa500");
        }, 3000);
      }
    } catch (error) {
      console.error("Save error:", error);
      showSaveStatus("❌ Failed to create save file", "#ff2d78");
    }
  }

  async function uploadSaveFile(input) {
    const file = input.files[0];
    if (!file) return;
    
    if (!currentGameName || !currentPlayer) {
      showSaveStatus("⚠️ Wait for game to load first!", "#ff2d78");
      input.value = '';
      return;
    }
    
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const encoded = e.target.result;
        const decoded = decodeURIComponent(atob(encoded));
        const saveData = JSON.parse(decoded);
        
        if (saveData.gameName !== currentGameName) {
          showSaveStatus(`🔒 Save file is for "${saveData.gameName}" but current game is "${currentGameName}"`, "#ff2d78");
          input.value = '';
          return;
        }
        
        let loadedCount = 0;
        if (saveData.localStorageData) {
          for (const [key, value] of Object.entries(saveData.localStorageData)) {
            localStorage.setItem(key, value);
            loadedCount++;
          }
        }
        
        if (saveData.cookies) {
          document.cookie = saveData.cookies;
        }
        
        showSaveStatus(`✅ Save loaded! (Restored ${loadedCount} items)`, "#39ff14");
        showSaveStatus("🔄 Game data restored! Please refresh the game to apply changes.", "#ffa500");
        
        const refreshBtn = document.createElement('button');
        refreshBtn.textContent = '🔄 RESTART GAME WITH SAVE';
        refreshBtn.className = 'save-btn';
        refreshBtn.style.marginLeft = '10px';
        refreshBtn.onclick = () => location.reload();
        document.getElementById('saveStatus').appendChild(refreshBtn);
        
        setTimeout(() => {
          if(refreshBtn.parentNode) refreshBtn.remove();
        }, 10000);
        
      } catch (error) {
        console.error("Load error:", error);
        showSaveStatus("❌ Corrupted or invalid save file", "#ff2d78");
      }
      input.value = '';
    };
    reader.readAsText(file);
  }
  
  function showSaveStatus(msg, color) {
    const statusSpan = document.getElementById('saveStatus');
    if (statusSpan) {
      statusSpan.innerHTML = msg;
      statusSpan.style.color = color;
      setTimeout(() => {
        if (statusSpan.innerHTML === msg) statusSpan.innerHTML = '';
      }, 5000);
    }
  }

  // ---------- VIRTUAL GAMEPAD (mobile only) ----------
  function initVirtualGamepad() {
    const overlay = document.getElementById('gamepadOverlay');
    if (!overlay) return;
    
    // Only enable on touch devices (mobile)
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouchDevice) return;
    
    overlay.style.display = 'flex';
    
    const buttons = overlay.querySelectorAll('.gamepad-btn');
    const activeKeys = new Set();
    
    // Function to send key event to the game (Ruffle)
    function sendKeyToGame(keyCode, type, key = '') {
      if (!currentPlayer || !currentPlayer.element) return;
      
      const event = new KeyboardEvent(type, {
        key: key,
        code: keyCode,
        bubbles: true,
        cancelable: true,
        composed: true
      });
      currentPlayer.element.dispatchEvent(event);
    }
    
    // Map button data-key to actual KeyboardEvent properties
    function getKeyInfo(keyId) {
      const mapping = {
        'ArrowUp': { key: 'ArrowUp', code: 'ArrowUp' },
        'ArrowDown': { key: 'ArrowDown', code: 'ArrowDown' },
        'ArrowLeft': { key: 'ArrowLeft', code: 'ArrowLeft' },
        'ArrowRight': { key: 'ArrowRight', code: 'ArrowRight' },
        ' ': { key: ' ', code: 'Space' },
        'Enter': { key: 'Enter', code: 'Enter' },
        'Shift': { key: 'Shift', code: 'ShiftLeft' },
        'Control': { key: 'Control', code: 'ControlLeft' },
        'KeyW': { key: 'w', code: 'KeyW' },
        'KeyA': { key: 'a', code: 'KeyA' },
        'KeyS': { key: 's', code: 'KeyS' },
        'KeyD': { key: 'd', code: 'KeyD' },
        'KeyE': { key: 'e', code: 'KeyE' },
        'KeyR': { key: 'r', code: 'KeyR' }
      };
      return mapping[keyId] || { key: keyId, code: keyId };
    }
    
    // Handle button press (start)
    function onButtonStart(btn, keyId) {
      const keyInfo = getKeyInfo(keyId);
      sendKeyToGame(keyInfo.code, 'keydown', keyInfo.key);
      
      // Visual feedback
      btn.style.transform = 'scale(0.96)';
      btn.style.background = 'var(--neon-cyan)';
      btn.style.color = '#080b14';
    }
    
    // Handle button release (end)
    function onButtonEnd(btn, keyId) {
      const keyInfo = getKeyInfo(keyId);
      sendKeyToGame(keyInfo.code, 'keyup', keyInfo.key);
      
      // Reset visual
      btn.style.transform = '';
      btn.style.background = '';
      btn.style.color = '';
    }
    
    // Attach touch/ mouse events to each button
    buttons.forEach(btn => {
      const keyId = btn.getAttribute('data-key');
      if (!keyId) return;
      
      // Touch events (mobile)
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        onButtonStart(btn, keyId);
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        onButtonEnd(btn, keyId);
      });
      btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        onButtonEnd(btn, keyId);
      });
      
      // Mouse events (for debugging on desktop with touch emulation)
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onButtonStart(btn, keyId);
      });
      btn.addEventListener('mouseup', (e) => {
        e.preventDefault();
        onButtonEnd(btn, keyId);
      });
      btn.addEventListener('mouseleave', (e) => {
        onButtonEnd(btn, keyId);
      });
    });
  }

  // ---------- GAME INITIALIZATION ----------
  const urlParams = new URLSearchParams(window.location.search);
  let gameFile = urlParams.get("game");

  if (gameFile) {
    gameFile = gameFile.trim();
    if (gameFile.includes("/")) {
      const parts = gameFile.split("/");
      gameFile = parts[parts.length - 1];
    }
    if (!gameFile.toLowerCase().endsWith(".swf")) {
      gameFile = gameFile + ".swf";
    }
  }

  const titleElem = document.getElementById("gameTitle");
  const loadingSpan = document.getElementById("loadingText");
  const gameContainerDiv = document.getElementById("game");
  const savePanel = document.getElementById("savePanel");

  function setLoadingMessage(msg, isError = false) {
    if (loadingSpan) {
      loadingSpan.innerHTML = msg;
      loadingSpan.style.color = isError ? "#ff5c7e" : "var(--text-muted)";
    }
  }

  if (!gameFile) {
    titleElem.textContent = "⚠️ GAME MISSING";
    setLoadingMessage("❌ No game specified. Use ?game=filename.swf in URL", true);
    gameContainerDiv.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff2d78;font-family:'Orbitron';">⚠️ GAME PARAMETER MISSING</div>`;
  } else {
    currentGameFile = gameFile;
    currentGameName = gameFile.replace(/\.swf$/i, "").replace(/_/g, " ").toUpperCase();
    titleElem.textContent = currentGameName + " // SAVE SUPPORT // TOUCH GAMEPAD";
    
    gameContainerDiv.innerHTML = "";
    
    const ruffleObj = window.RufflePlayer;
    if (!ruffleObj || !ruffleObj.newest) {
      setLoadingMessage("⚠️ Ruffle failed to load", true);
    } else {
      try {
        ruffleInstance = ruffleObj.newest();
        const player = ruffleInstance.createPlayer();
        currentPlayer = player;
        
        player.style.width = "100%";
        player.style.height = "100%";
        player.style.display = "block";
        player.style.border = "none";
        player.style.background = "#000000";
        
        player.config = {
          allowScriptAccess: true,
          letterbox: "off",
          autoplay: "auto",
          quality: "high",
          backgroundColor: "#000000"
        };
        
        gameContainerDiv.appendChild(player);
        
        const gamePath = "games/" + gameFile;
        setLoadingMessage(`🎮 Loading ${currentGameName} ...`);
        
        player.load(gamePath).then(() => {
          setLoadingMessage(`✅ GAME READY! Use SAVE/LOAD buttons. Mobile virtual gamepad active.`);
          savePanel.style.display = "flex";
          
          // Initialize virtual gamepad AFTER game loads
          initVirtualGamepad();
          
          let hasExistingData = false;
          for (let i = 0; i < localStorage.length; i++) {
            if (localStorage.key(i).includes(currentGameName.replace(/ /g, "_"))) {
              hasExistingData = true;
              break;
            }
          }
          if (hasExistingData) {
            showSaveStatus("💾 Found existing save data for this game!", "#39ff14");
          }
          
        }).catch((err) => {
          console.error("Load error:", err);
          setLoadingMessage(`❌ Failed to load ${gameFile}. Check if file exists in 'games/' folder`, true);
          savePanel.style.display = "none";
        });
        
      } catch (initErr) {
        setLoadingMessage("💥 Ruffle initialization failed", true);
      }
    }
  }
  
  // Extra CSS to fix player sizing
  const styleFix = document.createElement('style');
  styleFix.textContent = `
    #game ruffle-player, #game object, #game embed {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
    #game {
      position: relative !important;
      overflow: hidden !important;
      min-height: 400px;
    }
  `;
  document.head.appendChild(styleFix);
</script>
</body>
</html>
