<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIXELZONE · PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
  --gp-height-portrait:220px;
  --gp-width-landscape:280px;
}

.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08)2px,rgba(0,0,0,0.08)4px);z-index:9999}
.grid-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;
  background-image:linear-gradient(rgba(0,245,255,0.04)1px,transparent 1px),
  linear-gradient(90deg,rgba(0,245,255,0.04)1px,transparent 1px);
  background-size:40px 40px;z-index:0}

body{background:var(--bg-dark);color:var(--text-main);font-family:'Rajdhani',sans-serif;
  min-height:100vh;overflow-x:hidden}

/* NAV */
nav{position:sticky;top:0;z-index:200;background:rgba(8,11,20,0.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);padding:0 1rem;
  display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:1.2rem;letter-spacing:2px;
  color:var(--neon-cyan);text-shadow:0 0 16px var(--neon-cyan);text-decoration:none}
.logo span{color:var(--neon-pink)}
.nav-links{display:flex;gap:1rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--text-muted);font-size:0.75rem;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;transition:color 0.2s}
.nav-links a:hover{color:var(--neon-cyan)}
.nav-controls{display:flex;gap:0.5rem}
.btn{padding:6px 14px;background:transparent;color:var(--neon-pink);
  font-family:'Orbitron',monospace;font-size:0.65rem;font-weight:700;letter-spacing:1px;
  border:1px solid var(--neon-pink);cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px)100%,0%100%);transition:all 0.2s}
.btn:hover{background:var(--neon-pink);color:#080b14}

/* TITLE */
.game-title{text-align:center;padding:0.85rem 1rem 0.4rem;font-family:'Orbitron',monospace;
  font-size:clamp(0.7rem,2vw,1rem);letter-spacing:2px;color:var(--text-main);position:relative;z-index:1}

/* GAME WRAPPER */
.game-wrapper{position:relative;z-index:1;display:flex;justify-content:center;padding:0.5rem}

/* #game — desktop default */
#game{
  width:100%;max-width:1000px;aspect-ratio:16/9;
  border:1px solid var(--border-glow);background:#000;
  position:relative;overflow:hidden;min-height:min(400px,52vw);
}

/* LOADING */
.loading{text-align:center;color:var(--text-muted);padding:0.5rem;
  font-size:0.8rem;position:relative;z-index:1}

/* SAVE PANEL */
.save-panel{
  display:flex;flex-wrap:wrap;justify-content:center;gap:0.8rem;
  margin:0.75rem auto;padding:0.8rem;max-width:1000px;
  background:rgba(13,18,32,0.6);backdrop-filter:blur(8px);
  border:1px solid var(--border-glow);position:relative;z-index:1}
.save-btn,.file-input-label{padding:6px 16px;font-family:'Orbitron',monospace;
  font-size:0.7rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.2s}
.save-btn{background:rgba(0,245,255,0.1);color:var(--neon-cyan);border:1px solid var(--neon-cyan)}
.save-btn:hover{background:var(--neon-cyan);color:#080b14}
.file-input-label{background:rgba(255,45,120,0.1);color:var(--neon-pink);
  border:1px solid var(--neon-pink);display:inline-block}
.file-input-label:hover{background:var(--neon-pink);color:#080b14}
input[type="file"]{display:none}
.status-msg{color:var(--neon-green);font-size:0.75rem}

/* ════════════════════════════════════════════
   MOBILE GAMEPAD — lives inside #game
   Hidden by default, JS shows on touch devices
   ════════════════════════════════════════════ */
#mobileGamepad{
  display:none;
  position:absolute;
  bottom:0;left:0;right:0;
  height:var(--gp-height-portrait);
  z-index:500;
  background:rgba(6,9,18,0.94);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(0,245,255,0.2);
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  flex-direction:column;
  gap:6px;
  padding:8px 10px 10px;
}

/* Top bar */
.gp-topbar{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:6px;border-bottom:1px solid rgba(0,245,255,0.12);flex-shrink:0}
.gp-label{font-family:'Orbitron',monospace;font-size:0.58rem;letter-spacing:2px;color:var(--neon-cyan)}
.gp-topbar-btns{display:flex;gap:5px}
.gp-icon-btn{background:none;border:1px solid rgba(0,245,255,0.2);color:var(--text-muted);
  font-size:0.55rem;padding:3px 8px;cursor:pointer;font-family:'Orbitron',monospace;
  letter-spacing:1px;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.gp-icon-btn:active{border-color:var(--neon-cyan);color:var(--neon-cyan)}

/* Button body */
.gp-body{display:flex;flex:1;align-items:center;
  justify-content:space-between;gap:6px;overflow:hidden}

/* D-PAD */
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:3px;width:162px;height:162px;flex-shrink:0}
.dpad-btn{background:rgba(0,0,0,0.65);border:1px solid rgba(0,245,255,0.3);
  color:var(--neon-cyan);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  border-radius:7px;cursor:pointer;touch-action:none;
  -webkit-tap-highlight-color:transparent;transition:background 0.04s,transform 0.04s}
.dpad-btn.empty-slot,.dpad-btn.dpad-center{background:transparent;
  border-color:rgba(0,245,255,0.06);pointer-events:none}
.dpad-btn.pressed{background:var(--neon-cyan)!important;color:#080b14;transform:scale(0.9)}

/* MID BUTTONS */
.mid-btns{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;flex-shrink:0}
.mid-btn{background:rgba(0,0,0,0.65);border:1px solid rgba(0,245,255,0.2);
  color:var(--text-muted);font-family:'Orbitron',monospace;font-size:0.45rem;
  letter-spacing:1px;padding:7px 11px;border-radius:20px;
  cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;
  transition:background 0.04s;white-space:nowrap}
.mid-btn.pressed{background:rgba(0,245,255,0.18);color:var(--neon-cyan);border-color:var(--neon-cyan)}

/* ACTION CLUSTER — 3×3 diamond */
.action-cluster{display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);gap:3px;width:162px;height:162px;flex-shrink:0}
.action-btn{background:rgba(0,0,0,0.65);font-family:'Orbitron',monospace;
  font-size:0.72rem;font-weight:700;display:flex;align-items:center;
  justify-content:center;border-radius:50%;border:1px solid;
  cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;
  transition:background 0.04s,transform 0.04s}
.action-btn.empty-slot{background:transparent;border:none;pointer-events:none}
.action-btn.pressed{opacity:0.55;transform:scale(0.9)}

/* Key-map settings popup — floats above gamepad */
.gp-settings{
  position:absolute;
  bottom:var(--gp-height-portrait);
  left:0;right:0;
  background:rgba(8,11,20,0.97);
  border:1px solid var(--border-glow);
  padding:10px;display:none;flex-direction:column;gap:8px;z-index:600}
.gp-settings.open{display:flex}
.gp-settings p{font-family:'Orbitron',monospace;font-size:0.55rem;
  color:var(--text-muted);letter-spacing:1px;line-height:1.6}
.gp-settings textarea{background:var(--bg-card);border:1px solid var(--border-glow);
  color:var(--text-main);padding:6px 10px;width:100%;font-family:monospace;
  font-size:0.7rem;resize:vertical}
.gp-settings-row{display:flex;gap:8px}
.gp-settings-row button{flex:1;background:rgba(255,45,120,0.15);border:1px solid var(--neon-pink);
  color:var(--neon-pink);font-family:'Orbitron',monospace;font-size:0.6rem;
  letter-spacing:1px;padding:6px;cursor:pointer;transition:all 0.2s}
.gp-settings-row button:hover{background:var(--neon-pink);color:#080b14}

/* ════════════════════════════════════════════
   TOUCH MODE CLASSES applied by JS to #game
   ════════════════════════════════════════════ */

/* touch-mode: override aspect-ratio so we can use height */
#game.touch-mode{
  aspect-ratio:unset;min-height:unset;
  max-width:100%;width:100%;border:none;
}

/* PORTRAIT */
#game.touch-mode.portrait-mode{
  height:calc(100dvh - 60px);
}
/* Ruffle player stops before gamepad */
#game.touch-mode.portrait-mode ruffle-player,
#game.touch-mode.portrait-mode object{
  position:absolute!important;
  top:0!important;left:0!important;
  width:100%!important;
  height:calc(100% - var(--gp-height-portrait))!important;
  display:block!important;
}
/* Gamepad pinned to bottom */
#game.touch-mode.portrait-mode #mobileGamepad{
  position:absolute;bottom:0;left:0;right:0;
  height:var(--gp-height-portrait);width:auto;
  border-top:1px solid rgba(0,245,255,0.2);border-left:none;
}
#game.touch-mode.portrait-mode .gp-settings{
  bottom:var(--gp-height-portrait);
}

/* LANDSCAPE */
#game.touch-mode.landscape-mode{
  display:flex;flex-direction:row;
  height:calc(100dvh - 60px);
}
/* Ruffle fills the left flex portion */
#game.touch-mode.landscape-mode ruffle-player,
#game.touch-mode.landscape-mode object{
  position:relative!important;
  flex:1!important;
  width:auto!important;
  height:100%!important;
  display:block!important;
  min-width:0!important;
}
/* Gamepad is a flex child on the right */
#game.touch-mode.landscape-mode #mobileGamepad{
  position:relative;
  bottom:auto;left:auto;right:auto;top:auto;
  height:100%;
  width:var(--gp-width-landscape);
  min-width:var(--gp-width-landscape);
  border-top:none;
  border-left:1px solid rgba(0,245,255,0.2);
  flex-shrink:0;
}
#game.touch-mode.landscape-mode .gp-settings{
  bottom:0;top:0;
  left:auto;right:var(--gp-width-landscape);
  width:220px;height:auto;
}

/* FULLSCREEN — #game fills entire screen */
#game:-webkit-full-screen{width:100vw!important;height:100vh!important;max-width:none!important}
#game:-moz-full-screen{width:100vw!important;height:100vh!important;max-width:none!important}
#game:fullscreen{width:100vw!important;height:100vh!important;max-width:none!important}

/* Fullscreen landscape keeps flex layout */
#game.touch-mode.landscape-mode:-webkit-full-screen{display:flex!important}
#game.touch-mode.landscape-mode:fullscreen{display:flex!important}

/* Nav shrink on mobile */
@media(max-width:768px){
  .nav-links{gap:0.5rem}
  .nav-links a{font-size:0.65rem}
  .game-wrapper{padding:0.25rem}
  .btn-fullscreen{display:none}
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <a href="../index.html" class="logo">PIXEL<span>ZONE</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="index.html">Games</a></li>
    <li><a href="../Articles/index.html">Articles</a></li>
    <li><a href="../Walkthroughs/index.html">Walkthroughs</a></li>
  </ul>
  <div class="nav-controls">
    <button class="btn" onclick="goBack()">BACK</button>
    <button class="btn btn-fullscreen" onclick="fullscreenGame()">FULLSCREEN</button>
  </div>
</nav>

<div class="game-title" id="gameTitle">LOADING...</div>

<div class="game-wrapper">
  <div id="game">

    <!-- GAMEPAD lives inside #game so fullscreen carries it along -->
    <div id="mobileGamepad">

      <div class="gp-topbar">
        <span class="gp-label">🎮 GAMEPAD</span>
        <div class="gp-topbar-btns">
          <button class="gp-icon-btn" id="gpSettingsBtn">⚙ KEYS</button>
          <button class="gp-icon-btn" id="gpHideBtn">HIDE</button>
        </div>
      </div>

      <div class="gp-body">
        <!-- D-PAD -->
        <div class="dpad">
          <div class="dpad-btn empty-slot"></div>
          <div class="dpad-btn" data-key="ArrowUp"    data-code="ArrowUp">▲</div>
          <div class="dpad-btn empty-slot"></div>
          <div class="dpad-btn" data-key="ArrowLeft"  data-code="ArrowLeft">◀</div>
          <div class="dpad-btn dpad-center"></div>
          <div class="dpad-btn" data-key="ArrowRight" data-code="ArrowRight">▶</div>
          <div class="dpad-btn empty-slot"></div>
          <div class="dpad-btn" data-key="ArrowDown"  data-code="ArrowDown">▼</div>
          <div class="dpad-btn empty-slot"></div>
        </div>

        <!-- SELECT + START -->
        <div class="mid-btns">
          <div class="mid-btn" data-key=" " data-code="Space">SELECT</div>
          <div class="mid-btn" data-key="Enter" data-code="Enter">START</div>
        </div>

        <!-- ACTION BUTTONS diamond -->
        <div class="action-cluster">
          <div class="action-btn empty-slot"></div>
          <div class="action-btn" data-key="x" data-code="KeyX"
            style="border-color:rgba(191,95,255,0.6);color:#bf5fff">X</div>
          <div class="action-btn empty-slot"></div>
          <div class="action-btn" data-key="z" data-code="KeyZ"
            style="border-color:rgba(57,255,20,0.6);color:#39ff14">Y</div>
          <div class="action-btn empty-slot"></div>
          <div class="action-btn" data-key="a" data-code="KeyA"
            style="border-color:rgba(255,45,120,0.6);color:#ff2d78">A</div>
          <div class="action-btn empty-slot"></div>
          <div class="action-btn" data-key="s" data-code="KeyS"
            style="border-color:rgba(0,245,255,0.6);color:#00f5ff">B</div>
          <div class="action-btn empty-slot"></div>
        </div>
      </div>

      <!-- Key-map settings popup -->
      <div class="gp-settings" id="gpSettings">
        <p>FORMAT: LABEL:key:KeyCode — one per line<br>
          e.g. ▲:ArrowUp:ArrowUp &nbsp;|&nbsp; A:a:KeyA &nbsp;|&nbsp; SELECT: :Space</p>
        <textarea id="gpKeyEditor" rows="5"></textarea>
        <div class="gp-settings-row">
          <button id="gpSaveKeys">SAVE KEYS</button>
          <button id="gpResetKeys">RESET</button>
        </div>
      </div>

    </div><!-- /#mobileGamepad -->
  </div><!-- /#game -->
</div>

<div class="loading" id="loadingText">🔧 Initializing Ruffle...</div>

<div class="save-panel" id="savePanel" style="display:none">
  <button class="save-btn" onclick="downloadSaveFile()">💾 DOWNLOAD SAVE</button>
  <label class="file-input-label" for="loadSaveInput">📂 LOAD SAVE FILE</label>
  <input type="file" id="loadSaveInput" accept=".pzsave" onchange="uploadSaveFile(this)">
  <span id="saveStatus" class="status-msg"></span>
</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
let currentGameFile = null;
let currentPlayer   = null;
let currentGameName = null;

/* ── Navigation ── */
window.goBack = () => window.location.href = "index.html";
window.fullscreenGame = () => {
  const el  = document.getElementById("game");
  const req = el.requestFullscreen || el.webkitRequestFullscreen
            || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) req.call(el);
};

/* ── Save / Load (original — untouched) ── */
async function downloadSaveFile() {
  if (!currentGameName || !currentPlayer) { showSaveStatus("⚠️ Game not loaded!","#ff2d78"); return; }
  try {
    let gameData = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && (key.includes(currentGameName) || key.includes(currentGameFile?.replace('.swf','')))) {
        gameData[key] = localStorage.getItem(key);
      }
    }
    const saveFile = {
      gameName:currentGameName,gameFile:currentGameFile,
      timestamp:Date.now(),version:"1.0",localStorageData:gameData
    };
    const encoded = btoa(encodeURIComponent(JSON.stringify(saveFile)));
    const blob = new Blob([encoded],{type:"application/json"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href=url; a.download=`${currentGameName}_save_${new Date().toISOString().slice(0,19)}.pzsave`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showSaveStatus("✅ Save downloaded!","#39ff14");
  } catch(e) { showSaveStatus("❌ Save failed","#ff2d78"); }
}

async function uploadSaveFile(input) {
  const file = input.files[0];
  if (!file||!currentGameName){showSaveStatus("⚠️ Wait for game","#ff2d78");input.value='';return;}
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const decoded  = decodeURIComponent(atob(e.target.result));
      const saveData = JSON.parse(decoded);
      if (saveData.gameName!==currentGameName){showSaveStatus("🔒 Wrong game!","#ff2d78");input.value='';return;}
      let count=0;
      if(saveData.localStorageData){
        for(const [key,val] of Object.entries(saveData.localStorageData)){localStorage.setItem(key,val);count++;}
      }
      showSaveStatus(`✅ Loaded ${count} items! Refresh to apply`,"#39ff14");
    } catch(e){showSaveStatus("❌ Invalid save file","#ff2d78");}
    input.value='';
  };
  reader.readAsText(file);
}

function showSaveStatus(msg,color){
  const span=document.getElementById('saveStatus');
  if(!span)return;
  span.innerHTML=msg;span.style.color=color;
  setTimeout(()=>{if(span.innerHTML===msg)span.innerHTML='';},5000);
}

/* ── Touch detection ── */
function isTouchDevice(){
  return('ontouchstart' in window)||navigator.maxTouchPoints>0||
    window.matchMedia('(pointer: coarse)').matches;
}

/* ── Orientation ── */
function isLandscape(){
  if(screen.orientation?.type) return screen.orientation.type.startsWith('landscape');
  return window.innerWidth>window.innerHeight;
}

function applyOrientation(){
  const game=document.getElementById('game');
  if(!game.classList.contains('touch-mode')) return;
  if(isLandscape()){
    game.classList.add('landscape-mode');
    game.classList.remove('portrait-mode');
  } else {
    game.classList.add('portrait-mode');
    game.classList.remove('landscape-mode');
  }
}

/* ── Key dispatch — window + document + ruffle element + canvas ── */
function sendKey(key,code,type){
  const opts={key,code,bubbles:true,cancelable:true,composed:true};
  window.dispatchEvent(new KeyboardEvent(type,opts));
  document.dispatchEvent(new KeyboardEvent(type,opts));
  if(currentPlayer){
    try{currentPlayer.dispatchEvent(new KeyboardEvent(type,opts));}catch(_){}
    const cv=currentPlayer.querySelector('canvas');
    if(cv) try{cv.dispatchEvent(new KeyboardEvent(type,opts));}catch(_){}
  }
}

/* ── Bind button ── */
function bindBtn(el){
  const key=el.dataset.key, code=el.dataset.code;
  if(!key) return;
  let held=false;
  function press(e){
    e.preventDefault();
    if(held) return;
    held=true; el.classList.add('pressed');
    sendKey(key,code,'keydown');
  }
  function release(e){
    e.preventDefault();
    if(!held) return;
    held=false; el.classList.remove('pressed');
    sendKey(key,code,'keyup');
  }
  el.addEventListener('touchstart', press,  {passive:false});
  el.addEventListener('touchend',   release,{passive:false});
  el.addEventListener('touchcancel',release,{passive:false});
  el.addEventListener('mousedown',  press);
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
}

/* ── Default key map ── */
let keyMap={
  "▲":{key:"ArrowUp",code:"ArrowUp"},
  "▼":{key:"ArrowDown",code:"ArrowDown"},
  "◀":{key:"ArrowLeft",code:"ArrowLeft"},
  "▶":{key:"ArrowRight",code:"ArrowRight"},
  "SELECT":{key:" ",code:"Space"},
  "START":{key:"Enter",code:"Enter"},
  "X":{key:"x",code:"KeyX"},
  "Y":{key:"z",code:"KeyZ"},
  "A":{key:"a",code:"KeyA"},
  "B":{key:"s",code:"KeyS"},
};

/* ── Init gamepad ── */
function initMobileGamepad(){
  const game=document.getElementById('game');
  const pad =document.getElementById('mobileGamepad');

  game.classList.add('touch-mode');
  pad.style.display='flex';
  applyOrientation();

  pad.querySelectorAll('[data-key]').forEach(bindBtn);

  const settingsPanel=document.getElementById('gpSettings');
  const editor=document.getElementById('gpKeyEditor');

  function syncEditor(){
    editor.value=Object.entries(keyMap)
      .map(([label,{key,code}])=>`${label}:${key}:${code}`).join('\n');
  }
  syncEditor();

  document.getElementById('gpSettingsBtn').addEventListener('click',()=>
    settingsPanel.classList.toggle('open'));

  document.getElementById('gpHideBtn').addEventListener('click',()=>{
    pad.style.display='none';
    const restore=document.createElement('button');
    restore.textContent='🎮';
    restore.style.cssText='position:absolute;bottom:10px;left:50%;transform:translateX(-50%);'+
      'z-index:600;background:rgba(8,11,20,0.88);border:1px solid var(--neon-cyan);'+
      'color:var(--neon-cyan);font-size:1.4rem;padding:8px 18px;cursor:pointer;'+
      'border-radius:24px;-webkit-tap-highlight-color:transparent';
    restore.addEventListener('click',()=>{pad.style.display='flex';restore.remove();});
    game.appendChild(restore);
  });

  document.getElementById('gpSaveKeys').addEventListener('click',()=>{
    const newMap={};
    editor.value.split('\n').forEach(line=>{
      const parts=line.split(':');
      if(parts.length>=3){
        const label=parts[0].trim(),key=parts[1].trim(),code=parts[2].trim();
        if(label&&key&&code) newMap[label]={key,code};
      }
    });
    if(Object.keys(newMap).length){
      keyMap=newMap;
      pad.querySelectorAll('[data-key]').forEach(el=>{
        const label=el.textContent.trim();
        if(newMap[label]){el.dataset.key=newMap[label].key;el.dataset.code=newMap[label].code;}
      });
      try{localStorage.setItem('pz_gp_keymap',JSON.stringify(keyMap));}catch(_){}
      syncEditor();
      settingsPanel.classList.remove('open');
    }
  });

  document.getElementById('gpResetKeys').addEventListener('click',()=>{
    keyMap={
      "▲":{key:"ArrowUp",code:"ArrowUp"},"▼":{key:"ArrowDown",code:"ArrowDown"},
      "◀":{key:"ArrowLeft",code:"ArrowLeft"},"▶":{key:"ArrowRight",code:"ArrowRight"},
      "SELECT":{key:" ",code:"Space"},"START":{key:"Enter",code:"Enter"},
      "X":{key:"x",code:"KeyX"},"Y":{key:"z",code:"KeyZ"},
      "A":{key:"a",code:"KeyA"},"B":{key:"s",code:"KeyS"},
    };
    try{localStorage.removeItem('pz_gp_keymap');}catch(_){}
    syncEditor();
  });

  try{
    const saved=localStorage.getItem('pz_gp_keymap');
    if(saved){keyMap=JSON.parse(saved);syncEditor();}
  }catch(_){}

  /* Orientation change listeners */
  const onRotate=()=>setTimeout(applyOrientation,120);
  if(screen.orientation?.addEventListener) screen.orientation.addEventListener('change',onRotate);
  window.addEventListener('orientationchange',onRotate);
  window.addEventListener('resize',onRotate);
}

/* ── Ruffle fill fix ── */
const styleFix=document.createElement('style');
styleFix.textContent=`
  /* Desktop / non-touch default */
  #game ruffle-player, #game object {
    position:absolute!important;top:0!important;left:0!important;
    width:100%!important;height:100%!important;display:block!important;
  }
  /* Portrait: Ruffle height = total height minus gamepad */
  #game.touch-mode.portrait-mode ruffle-player,
  #game.touch-mode.portrait-mode object {
    height:calc(100% - var(--gp-height-portrait))!important;
    width:100%!important;
  }
  /* Landscape: Ruffle is a flex child, gamepad is on the right */
  #game.touch-mode.landscape-mode ruffle-player,
  #game.touch-mode.landscape-mode object {
    position:relative!important;flex:1!important;
    width:auto!important;height:100%!important;min-width:0!important;
  }
`;
document.head.appendChild(styleFix);

/* ── Game init ── */
const urlParams=new URLSearchParams(window.location.search);
let gameFile=urlParams.get("game");

if(gameFile){
  gameFile=gameFile.trim();
  if(gameFile.includes("/")) gameFile=gameFile.split("/").pop();
  if(!gameFile.toLowerCase().endsWith(".swf")) gameFile+=".swf";

  currentGameFile=gameFile;
  currentGameName=gameFile.replace(/\.swf$/i,"").replace(/_/g," ").toUpperCase();

  const isTouch=isTouchDevice();
  document.getElementById("gameTitle").textContent=
    currentGameName+(isTouch?" // TAP FULLSCREEN FOR BEST EXPERIENCE":"");

  function startRuffle(){
    const ruffle=window.RufflePlayer?.newest?.();
    if(!ruffle){document.getElementById("loadingText").textContent="❌ Ruffle not available";return;}

    const player=ruffle.createPlayer();
    currentPlayer=player;
    player.style.width="100%";
    player.style.height="100%";
    player.style.display="block";
    player.config={
      allowScriptAccess:true,letterbox:"off",
      autoplay:"auto",quality:"high",
      backgroundColor:"#000000",wmode:"transparent"
    };

    /* Insert player BEFORE the gamepad so it doesn't overlap it in the DOM */
    const game=document.getElementById("game");
    const pad =document.getElementById("mobileGamepad");
    game.insertBefore(player,pad);

    document.getElementById("loadingText").textContent="🎮 Loading game...";

    player.load("games/"+gameFile)
      .then(()=>{
        document.getElementById("loadingText").textContent=
          isTouch?"✅ READY! Tap FULLSCREEN for best experience":"✅ READY!";
        document.getElementById("savePanel").style.display="flex";
        if(isTouch) initMobileGamepad();
      })
      .catch(err=>{
        console.error(err);
        document.getElementById("loadingText").textContent="❌ Failed to load. Check filename.";
      });
  }

  let attempts=0;
  const ruffleWait=setInterval(()=>{
    attempts++;
    if(window.RufflePlayer?.newest?.()){clearInterval(ruffleWait);startRuffle();}
    else if(attempts>40){
      clearInterval(ruffleWait);
      document.getElementById("loadingText").textContent="❌ Ruffle failed. Check internet.";
    }
  },100);

} else {
  document.getElementById("gameTitle").textContent="⚠️ NO GAME SPECIFIED";
  document.getElementById("loadingText").textContent="❌ No game specified. Use ?game=filename.swf";
  document.getElementById("game").innerHTML+=
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'+
    'color:#ff2d78;font-family:Orbitron,monospace;font-size:0.75rem;letter-spacing:2px">'+
    '⚠️ GAME PARAMETER MISSING</div>';
}
</script>
</body>
</html>
