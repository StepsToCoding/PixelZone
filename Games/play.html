<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --bg-card2:#111827;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}

/* BACKGROUND (EXACT SAME AS HOMEPAGE) */
.scanlines{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  z-index:999;
}

.grid-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  z-index:0;
}

body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
}

/* NAV (EXACT COPY) */
nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);
  padding:0 2rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:64px;
}

.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;
  font-size:1.4rem;
  letter-spacing:3px;
  color:var(--neon-cyan);
  text-shadow:0 0 16px var(--neon-cyan);
}
.logo span{color:var(--neon-pink)}

.nav-links{
  display:flex;
  gap:2rem;
  list-style:none;
}

.nav-links a{
  text-decoration:none;
  color:var(--text-muted);
  font-size:0.9rem;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:600;
  transition:color 0.2s;
}
.nav-links a:hover{
  color:var(--neon-cyan);
}

/* BUTTONS (MATCH STYLE) */
.controls{
  display:flex;
  gap:1rem;
}

.btn{
  padding:8px 18px;
  background:transparent;
  color:var(--neon-pink);
  font-family:'Orbitron',monospace;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:2px;
  border:1px solid var(--neon-pink);
  cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.btn:hover{
  background:var(--neon-pink);
  color:#080b14;
}

/* TITLE */
.title{
  position:relative;
  z-index:1;
  text-align:center;
  padding:2rem;
  font-family:'Orbitron';
  font-size:1.2rem;
}

/* GAME */
.game-container{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  padding:1rem;
}

#game{
  width:100%;
  max-width:900px;
  height:600px;
  border:1px solid var(--border-glow);
  background:black;
}

/* LOADING */
.loading{
  position:relative;
  z-index:1;
  text-align:center;
  color:var(--text-muted);
  margin-top:1rem;
}

/* RTL */
[dir="rtl"]{direction:rtl}
</style>

</head>

<body>

<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <div class="logo">PIXEL<span>ZONE</span></div>

  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="index.html">Games</a></li>
    <li><a href="#">Articles</a></li>
    <li><a href="#">Walkthroughs</a></li>
  </ul>

  <div class="controls">
    <button class="btn" onclick="goBack()">BACK</button>
    <button class="btn" onclick="fullscreenGame()">FULLSCREEN</button>
  </div>
</nav>

<div class="title" id="gameTitle">Loading...</div>

<div class="game-container">
  <div id="game"></div>
</div>

<div class="loading" id="loadingText">Loading game...</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<script>
// NAV BUTTONS
function goBack(){
  window.location.href = "index.html";
}

function fullscreenGame(){
  const el = document.getElementById("game");
  if(el.requestFullscreen) el.requestFullscreen();
}

// LOAD GAME
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if(!game){
  document.getElementById("gameTitle").textContent = "ERROR";
  document.getElementById("loadingText").textContent = "No game selected";
}else{
  document.getElementById("gameTitle").textContent = game.replace(".swf","").toUpperCase();

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  document.getElementById("game").appendChild(player);

  player.load("games/" + game)
  .then(()=>document.getElementById("loadingText").style.display="none")
  .catch(()=>document.getElementById("loadingText").textContent="Failed to load game");
}
</script>

</body>
</html>
