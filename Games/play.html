<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIXELZONE · GAME CORE · PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --neon-green:#39ff14;
  --bg-dark:#080b14;
  --bg-card:#0d1220;
  --bg-card2:#111827;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}

.scanlines{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
  z-index:999;
}
.grid-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  background-image:linear-gradient(rgba(0,245,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.04) 1px,transparent 1px);
  background-size:40px 40px;
  z-index:0;
}
body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);
  padding:0 1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:60px;
  flex-wrap:wrap;
}
.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;
  font-size:1.2rem;
  letter-spacing:2px;
  color:var(--neon-cyan);
  text-shadow:0 0 16px var(--neon-cyan);
}
.logo span{color:var(--neon-pink)}
.nav-links{
  display:flex;
  gap:1rem;
  list-style:none;
}
.nav-links a{
  text-decoration:none;
  color:var(--text-muted);
  font-size:0.75rem;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:600;
  transition:color 0.2s;
}
.nav-links a:hover{color:var(--neon-cyan);}
.controls{
  display:flex;
  gap:0.5rem;
}
.btn{
  padding:6px 14px;
  background:transparent;
  color:var(--neon-pink);
  font-family:'Orbitron',monospace;
  font-size:0.65rem;
  font-weight:700;
  letter-spacing:1px;
  border:1px solid var(--neon-pink);
  cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all 0.2s;
}
.btn:hover{
  background:var(--neon-pink);
  color:#080b14;
}
.title{
  position:relative;
  z-index:1;
  text-align:center;
  padding:1rem;
  font-family:'Orbitron';
  font-size:1rem;
}
.game-container{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  padding:0.5rem;
}
#game{
  width:100%;
  max-width:1000px;
  height:auto;
  aspect-ratio:16/9;
  border:1px solid var(--border-glow);
  background:black;
  position:relative;
}
.loading{
  position:relative;
  z-index:1;
  text-align:center;
  color:var(--text-muted);
  margin-top:0.5rem;
  font-size:0.8rem;
}
.save-panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
  margin: 1rem auto;
  padding: 0.8rem;
  max-width: 1000px;
  background: rgba(13, 18, 32, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-glow);
  border-radius: 4px;
}
.save-btn, .file-input-label {
  padding: 6px 16px;
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.save-btn {
  background: rgba(0, 245, 255, 0.1);
  color: var(--neon-cyan);
  border: 1px solid var(--neon-cyan);
}
.save-btn:hover {
  background: var(--neon-cyan);
  color: #080b14;
}
.file-input-label {
  background: rgba(255, 45, 120, 0.1);
  color: var(--neon-pink);
  border: 1px solid var(--neon-pink);
  display: inline-block;
}
.file-input-label:hover {
  background: var(--neon-pink);
  color: #080b14;
}
input[type="file"] { display: none; }
.status-msg {
  color: var(--neon-green);
  font-size: 0.75rem;
  margin-left: 0.5rem;
  font-family: 'Rajdhani', monospace;
  word-break: break-word;
}

/* ===== MOBILE-ONLY GAMEPAD ===== */
.gamepad-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(8, 11, 20, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--neon-cyan);
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(0,245,255,0.3);
  display: none; /* Hidden by default, shown only on mobile */
  touch-action: none;
}
.gamepad-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(0,245,255,0.15);
  border-radius: 16px 16px 0 0;
  cursor: move;
  user-select: none;
}
.gamepad-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--neon-cyan);
}
.gamepad-controls {
  display: flex;
  gap: 8px;
}
.gamepad-icon-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1rem;
  cursor: pointer;
  padding: 0 4px;
}
.gamepad-icon-btn:hover {
  color: var(--neon-cyan);
}
.gamepad-buttons {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.gamepad-row {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.gamepad-btn {
  background: rgba(0, 0, 0, 0.8);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  font-family: 'Orbitron', monospace;
  font-weight: bold;
  font-size: 1rem;
  min-width: 60px;
  padding: 12px 0;
  text-align: center;
  border-radius: 12px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: 0.05s linear;
  box-shadow: 0 0 4px rgba(0,245,255,0.3);
}
.gamepad-btn:active {
  background: var(--neon-cyan);
  color: #080b14;
  transform: scale(0.96);
}
.gamepad-settings {
  padding: 12px;
  border-top: 1px solid var(--border-glow);
  display: none;
  flex-direction: column;
  gap: 10px;
}
.gamepad-settings.open {
  display: flex;
}
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 0.7rem;
}
.setting-row input, .setting-row textarea {
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  color: var(--text-main);
  padding: 6px 10px;
  width: 100%;
  font-family: monospace;
  font-size: 0.7rem;
}
.setting-row button {
  background: rgba(255,45,120,0.2);
  border: 1px solid var(--neon-pink);
  color: var(--neon-pink);
  padding: 4px 12px;
  cursor: pointer;
}
.resize-handle {
  position: absolute;
  bottom: 4px;
  right: 4px;
  width: 16px;
  height: 16px;
  background: var(--neon-cyan);
  cursor: nw-resize;
  border-radius: 2px;
  opacity: 0.5;
}

/* Only show on mobile devices */
@media (max-width: 768px) {
  .gamepad-container {
    display: block;
  }
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>

<nav>
  <div class="logo">PIXEL<span>ZONE</span></div>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="index.html">Games</a></li>
    <li><a href="../Articles/index.html">Articles</a></li>
    <li><a href="../Walkthroughs/index.html">Walkthroughs</a></li>
  </ul>
  <div class="controls">
    <button class="btn" onclick="goBack()">BACK</button>
    <button class="btn" onclick="fullscreenGame()">FULLSCREEN</button>
  </div>
</nav>

<div class="title" id="gameTitle">Loading...</div>
<div class="game-container"><div id="game"></div></div>

<div class="save-panel" id="savePanel" style="display: none;">
  <button class="save-btn" id="saveGameBtn" onclick="downloadSaveFile()">💾 DOWNLOAD SAVE</button>
  <label class="file-input-label" for="loadSaveInput">📂 LOAD SAVE FILE</label>
  <input type="file" id="loadSaveInput" accept=".pzsave" onchange="uploadSaveFile(this)">
  <span id="saveStatus" class="status-msg"></span>
</div>

<div class="loading" id="loadingText">🔧 Initializing Ruffle & game engine...</div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  // ========== GLOBAL VARIABLES ==========
  let currentGameFile = null;
  let currentPlayer = null;
  let currentGameName = null;
  let ruffleInstance = null;

  // ========== NAVIGATION ==========
  window.goBack = () => window.location.href = "index.html";
  window.fullscreenGame = () => {
    const container = document.getElementById("game");
    if (container?.requestFullscreen) container.requestFullscreen();
  };

  // ========== SAVE/LOAD FUNCTIONS ==========
  async function downloadSaveFile() {
    if (!currentGameName || !currentPlayer) {
      showSaveStatus("⚠️ Game not loaded yet!", "#ff2d78");
      return;
    }
    try {
      let gameSpecificStorage = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.includes(currentGameName) || key.includes(currentGameFile?.replace('.swf', '')))) {
          gameSpecificStorage[key] = localStorage.getItem(key);
        }
      }
      const saveFile = {
        gameName: currentGameName,
        gameFile: currentGameFile,
        timestamp: Date.now(),
        version: "1.0",
        localStorageData: gameSpecificStorage,
        cookies: document.cookie,
        note: "Save file for " + currentGameName
      };
      const jsonStr = JSON.stringify(saveFile);
      const encoded = btoa(encodeURIComponent(jsonStr));
      const blob = new Blob([encoded], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${currentGameName}_save_${new Date().toISOString().slice(0,19)}.pzsave`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showSaveStatus("✅ Save file downloaded!", "#39ff14");
    } catch (error) {
      console.error("Save error:", error);
      showSaveStatus("❌ Failed to create save file", "#ff2d78");
    }
  }

  async function uploadSaveFile(input) {
    const file = input.files[0];
    if (!file) return;
    if (!currentGameName || !currentPlayer) {
      showSaveStatus("⚠️ Wait for game to load first!", "#ff2d78");
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const encoded = e.target.result;
        const decoded = decodeURIComponent(atob(encoded));
        const saveData = JSON.parse(decoded);
        if (saveData.gameName !== currentGameName) {
          showSaveStatus(`🔒 Save file is for "${saveData.gameName}" but current game is "${currentGameName}"`, "#ff2d78");
          input.value = '';
          return;
        }
        let loadedCount = 0;
        if (saveData.localStorageData) {
          for (const [key, value] of Object.entries(saveData.localStorageData)) {
            localStorage.setItem(key, value);
            loadedCount++;
          }
        }
        showSaveStatus(`✅ Save loaded! (Restored ${loadedCount} items)`, "#39ff14");
        showSaveStatus("🔄 Game data restored! Please refresh the game to apply changes.", "#ffa500");
        const refreshBtn = document.createElement('button');
        refreshBtn.textContent = '🔄 RESTART GAME WITH SAVE';
        refreshBtn.className = 'save-btn';
        refreshBtn.onclick = () => location.reload();
        document.getElementById('saveStatus').appendChild(refreshBtn);
        setTimeout(() => { if(refreshBtn.parentNode) refreshBtn.remove(); }, 10000);
      } catch (error) {
        console.error("Load error:", error);
        showSaveStatus("❌ Corrupted or invalid save file", "#ff2d78");
      }
      input.value = '';
    };
    reader.readAsText(file);
  }
  
  function showSaveStatus(msg, color) {
    const statusSpan = document.getElementById('saveStatus');
    if (statusSpan) {
      statusSpan.innerHTML = msg;
      statusSpan.style.color = color;
      setTimeout(() => { if (statusSpan.innerHTML === msg) statusSpan.innerHTML = ''; }, 5000);
    }
  }

  // ========== VIRTUAL GAMEPAD (Mobile Only) ==========
  let gamepadContainer = null;
  let keyMap = {
    "▲": "ArrowUp", "▼": "ArrowDown", "◀": "ArrowLeft", "▶": "ArrowRight",
    "␣": " ", "↵": "Enter",
    "W": "KeyW", "A": "KeyA", "S": "KeyS", "D": "KeyD", "E": "KeyE", "R": "KeyR"
  };

  function sendKeyToGame(keyCode, type) {
    if (!currentPlayer || !currentPlayer.element) return;
    const event = new KeyboardEvent(type, { key: keyCode, code: keyCode, bubbles: true, cancelable: true });
    currentPlayer.element.dispatchEvent(event);
    document.dispatchEvent(event);
  }

  function rebuildGamepad() {
    const wrap = document.querySelector('.gamepad-buttons');
    if (!wrap) return;
    wrap.innerHTML = '';
    const rows = [["▲", "▼", "◀", "▶"], ["␣", "↵"], ["W", "A", "S", "D", "E", "R"]];
    rows.forEach(row => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'gamepad-row';
      row.forEach(label => {
        const btn = document.createElement('div');
        btn.className = 'gamepad-btn';
        btn.textContent = label;
        btn.setAttribute('data-key', keyMap[label] || label);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); sendKeyToGame(btn.dataset.key, 'keydown'); btn.style.background = 'var(--neon-cyan)'; btn.style.color = '#080b14'; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); sendKeyToGame(btn.dataset.key, 'keyup'); btn.style.background = ''; btn.style.color = ''; });
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); sendKeyToGame(btn.dataset.key, 'keydown'); btn.style.background = 'var(--neon-cyan)'; btn.style.color = '#080b14'; });
        btn.addEventListener('mouseup', () => { sendKeyToGame(btn.dataset.key, 'keyup'); btn.style.background = ''; btn.style.color = ''; });
        btn.addEventListener('mouseleave', () => { sendKeyToGame(btn.dataset.key, 'keyup'); btn.style.background = ''; btn.style.color = ''; });
        rowDiv.appendChild(btn);
      });
      wrap.appendChild(rowDiv);
    });
  }

  function initGamepadUI() {
    if (document.querySelector('.gamepad-container')) return;
    const container = document.createElement('div');
    container.className = 'gamepad-container';
    container.innerHTML = `
      <div class="gamepad-header">
        <span class="gamepad-title">🎮 GAMEPAD</span>
        <div class="gamepad-controls">
          <button class="gamepad-icon-btn" id="toggleGamepadSettings">⚙️</button>
          <button class="gamepad-icon-btn" id="hideGamepadBtn">✖️</button>
        </div>
      </div>
      <div class="gamepad-buttons"></div>
      <div class="gamepad-settings" id="gamepadSettingsPanel">
        <div class="setting-row"><textarea id="keyMapEditor" rows="4" placeholder="Label:KeyCode"></textarea></div>
        <div class="setting-row"><button id="saveKeyMapBtn">SAVE KEYS</button><button id="resetKeyMapBtn">RESET</button></div>
      </div>
      <div class="resize-handle"></div>
    `;
    document.body.appendChild(container);
    gamepadContainer = container;
    rebuildGamepad();

    const header = container.querySelector('.gamepad-header');
    let dragOffsetX, dragOffsetY, isDragging = false;
    header.addEventListener('mousedown', startDrag);
    header.addEventListener('touchstart', startDrag);
    function startDrag(e) {
      isDragging = true;
      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragOffsetX = clientX - rect.left;
      dragOffsetY = clientY - rect.top;
      container.style.position = 'fixed';
      container.style.bottom = 'auto';
      container.style.right = 'auto';
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchmove', onDrag);
      document.addEventListener('touchend', stopDrag);
    }
    function onDrag(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      let left = clientX - dragOffsetX;
      let top = clientY - dragOffsetY;
      left = Math.min(window.innerWidth - container.offsetWidth, Math.max(0, left));
      top = Math.min(window.innerHeight - container.offsetHeight, Math.max(0, top));
      container.style.left = left + 'px';
      container.style.top = top + 'px';
    }
    function stopDrag() { isDragging = false; document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', stopDrag); document.removeEventListener('touchmove', onDrag); document.removeEventListener('touchend', stopDrag); }
    
    const resizeHandle = container.querySelector('.resize-handle');
    let startWidth, startX, isResizing = false;
    resizeHandle.addEventListener('mousedown', startResize);
    resizeHandle.addEventListener('touchstart', startResize);
    function startResize(e) {
      isResizing = true;
      startWidth = container.offsetWidth;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      document.addEventListener('mousemove', onResize);
      document.addEventListener('mouseup', stopResize);
      document.addEventListener('touchmove', onResize);
      document.addEventListener('touchend', stopResize);
    }
    function onResize(e) {
      if (!isResizing) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const deltaX = clientX - startX;
      let newWidth = startWidth + deltaX;
      newWidth = Math.min(400, Math.max(180, newWidth));
      container.style.width = newWidth + 'px';
    }
    function stopResize() { isResizing = false; document.removeEventListener('mousemove', onResize); document.removeEventListener('mouseup', stopResize); document.removeEventListener('touchmove', onResize); document.removeEventListener('touchend', stopResize); }
    
    document.getElementById('toggleGamepadSettings').addEventListener('click', () => document.getElementById('gamepadSettingsPanel').classList.toggle('open'));
    document.getElementById('hideGamepadBtn').addEventListener('click', () => container.style.display = 'none');
    document.getElementById('saveKeyMapBtn').addEventListener('click', () => {
      const lines = document.getElementById('keyMapEditor').value.split('\n');
      const newMap = {};
      lines.forEach(line => {
        if (line.includes(':')) {
          const [label, code] = line.split(':');
          if (label && code) newMap[label.trim()] = code.trim();
        }
      });
      if (Object.keys(newMap).length) keyMap = newMap;
      rebuildGamepad();
      localStorage.setItem('pixelzone_gamepad_map', JSON.stringify(keyMap));
    });
    document.getElementById('resetKeyMapBtn').addEventListener('click', () => {
      keyMap = { "▲": "ArrowUp", "▼": "ArrowDown", "◀": "ArrowLeft", "▶": "ArrowRight", "␣": " ", "↵": "Enter", "W": "KeyW", "A": "KeyA", "S": "KeyS", "D": "KeyD", "E": "KeyE", "R": "KeyR" };
      rebuildGamepad();
      localStorage.removeItem('pixelzone_gamepad_map');
    });
    const savedMap = localStorage.getItem('pixelzone_gamepad_map');
    if (savedMap) { keyMap = JSON.parse(savedMap); rebuildGamepad(); }
    const width = localStorage.getItem('pixelzone_gamepad_width');
    if (width) container.style.width = width + 'px';
    const left = localStorage.getItem('pixelzone_gamepad_left');
    const top = localStorage.getItem('pixelzone_gamepad_top');
    if (left && top) { container.style.left = left + 'px'; container.style.top = top + 'px'; container.style.bottom = 'auto'; container.style.right = 'auto'; }
    container.addEventListener('dragend', () => { localStorage.setItem('pixelzone_gamepad_left', parseInt(container.style.left)); localStorage.setItem('pixelzone_gamepad_top', parseInt(container.style.top)); });
  }

  // ========== GAME INITIALIZATION ==========
  const urlParams = new URLSearchParams(window.location.search);
  let gameFile = urlParams.get("game");
  if (gameFile) {
    gameFile = gameFile.trim();
    if (gameFile.includes("/")) gameFile = gameFile.split("/").pop();
    if (!gameFile.toLowerCase().endsWith(".swf")) gameFile += ".swf";
  }

  const titleElem = document.getElementById("gameTitle");
  const loadingSpan = document.getElementById("loadingText");
  const gameContainerDiv = document.getElementById("game");
  const savePanel = document.getElementById("savePanel");

  function setLoadingMessage(msg, isError = false) {
    if (loadingSpan) {
      loadingSpan.innerHTML = msg;
      loadingSpan.style.color = isError ? "#ff5c7e" : "var(--text-muted)";
    }
  }

  if (!gameFile) {
    titleElem.textContent = "⚠️ GAME MISSING";
    setLoadingMessage("❌ No game specified. Use ?game=filename.swf in URL", true);
    gameContainerDiv.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff2d78;font-family:'Orbitron';">⚠️ GAME PARAMETER MISSING</div>`;
  } else {
    currentGameFile = gameFile;
    currentGameName = gameFile.replace(/\.swf$/i, "").replace(/_/g, " ").toUpperCase();
    titleElem.textContent = currentGameName + " // GAMEPAD READY";
    gameContainerDiv.innerHTML = "";
    const ruffleObj = window.RufflePlayer;
    if (!ruffleObj?.newest) {
      setLoadingMessage("⚠️ Ruffle failed to load", true);
    } else {
      try {
        ruffleInstance = ruffleObj.newest();
        const player = ruffleInstance.createPlayer();
        currentPlayer = player;
        player.style.width = "100%";
        player.style.height = "100%";
        player.style.display = "block";
        player.style.border = "none";
        player.style.background = "#000000";
        player.config = { allowScriptAccess: true, letterbox: "off", autoplay: "auto", quality: "high", backgroundColor: "#000000" };
        gameContainerDiv.appendChild(player);
        const gamePath = "games/" + gameFile;
        setLoadingMessage(`🎮 Loading ${currentGameName} ...`);
        player.load(gamePath).then(() => {
          setLoadingMessage(`✅ GAME READY! Save/Load available. Mobile gamepad ready.`);
          savePanel.style.display = "flex";
          initGamepadUI();
        }).catch((err) => {
          console.error(err);
          setLoadingMessage(`❌ Failed to load ${gameFile}. Check if file exists in 'games/' folder`, true);
          savePanel.style.display = "none";
        });
      } catch (initErr) {
        setLoadingMessage("💥 Ruffle initialization failed", true);
      }
    }
  }
  const styleFix = document.createElement('style');
  styleFix.textContent = `#game ruffle-player, #game object{ width:100% !important; height:100% !important; display:block; position:absolute; top:0; left:0; } #game{ position:relative; overflow:hidden; min-height:400px; }`;
  document.head.appendChild(styleFix);
</script>
</body>
</html>
