<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --neon-cyan:#00f5ff;
  --neon-pink:#ff2d78;
  --bg-dark:#080b14;
  --text-main:#e8eaf6;
  --text-muted:#7a8baa;
  --border-glow:rgba(0,245,255,0.18);
}

body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
}

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,11,20,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-glow);
  padding:0 2rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:64px;
}

.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;
  font-size:1.4rem;
  letter-spacing:3px;
  color:var(--neon-cyan);
}

.controls{
  display:flex;
  gap:1rem;
}

.btn{
  padding:8px 18px;
  background:transparent;
  color:var(--neon-pink);
  font-family:'Orbitron',monospace;
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:2px;
  border:1px solid var(--neon-pink);
  cursor:pointer;
}

#game{
  width:100%;
  max-width:900px;
  height:600px;
  border:1px solid var(--border-glow);
  background:black;
  margin:2rem auto;
}

.title{
  text-align:center;
  padding:1rem;
  font-family:'Orbitron';
}

.loading{
  text-align:center;
  color:var(--text-muted);
}

/* optional scanlines */
.scanlines{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
}
</style>

</head>

<body>

<div class="scanlines"></div>

<nav>
  <div class="logo">PIXELZONE</div>

  <div class="controls">
    <button class="btn" onclick="goBack()">BACK</button>
    <button class="btn" onclick="fullscreenGame()">FULLSCREEN</button>
  </div>
</nav>

<div class="title" id="gameTitle">Loading...</div>

<div id="game"></div>

<div class="loading" id="loadingText">Loading game...</div>

<!-- Ruffle -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<script>
// buttons
function goBack(){
  window.location.href = "index.html";
}

function fullscreenGame(){
  const el = document.getElementById("game");
  if(el.requestFullscreen){
    el.requestFullscreen();
  } else if(el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  } else if(el.msRequestFullscreen){
    el.msRequestFullscreen();
  }
}

// wait until everything loads
window.addEventListener("load", () => {

  const params = new URLSearchParams(window.location.search);
  const game = params.get("game");

  // no game
  if(!game){
    document.getElementById("gameTitle").textContent = "ERROR";
    document.getElementById("loadingText").textContent = "No game selected";
    return;
  }

  // security check
  if(!game.endsWith(".swf")){
    document.getElementById("loadingText").textContent = "Invalid file";
    return;
  }

  document.getElementById("gameTitle").textContent =
    game.replace(".swf","").toUpperCase();

  // ruffle init
  if(!window.RufflePlayer){
    document.getElementById("loadingText").textContent = "Ruffle failed to load";
    return;
  }

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  document.getElementById("game").appendChild(player);

  player.load("games/" + game)
    .then(() => {
      document.getElementById("loadingText").style.display = "none";
    })
    .catch(() => {
      document.getElementById("loadingText").textContent = "Failed to load game";
    });

});
</script>

</body>
</html>
